# Tool configuration only. The project has no Python packaging metadata.
# Entry point: python -I scripts/lint.py check|format|hook

[tool.ruff]
line-length = 79
target-version = "py39"
src = [
    "console",
    "scripts",
    "user",
    "chip-adapt/sifli",
    "chip-adapt/host",
    "chip-adapt/esp32/host",
]
respect-gitignore = true
extend-exclude = [
    ".claude",
    ".scratch",
    "build",
    "dist",
    "licenses",
    "sessions",
    "engine/lvgl",
    "engine/third_party",
    "console/assets/vendor",
    "chip-adapt/vendor",
    "chip-adapt/exports",
    "chip-adapt/sifli/host/vendor",
    "chip-adapt/sifli/host/.cache",
    "chip-adapt/esp32/host/vendor",
    "chip-adapt/esp32/host/.cache",
    ".test-tmp",
    ".test-sessions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E402",
    "E501",
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
