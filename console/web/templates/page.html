<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LVGL 检视台</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1b1b1b;
  --panel: #232323;
  --panel-2: #282828;
  --panel-3: #303030;
  --line: #383838;
  --line-strong: #4a4a4a;
  --text: #e4e4e4;
  --muted: #a0a0a0;
  --dim: #737373;
  --accent: #4d9de0;
  --accent-wash: rgba(77, 157, 224, .12);
  --record: #e5484d;
  --test: #3fb950;
  --amber: #e8a33d;
  --red: #e5484d;
  --blue: #4d9de0;
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "Microsoft YaHei UI", monospace;
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) transparent; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #1b1b1b; }
::-webkit-scrollbar-thumb { background: #464646; border: 2px solid #1b1b1b; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
[hidden] { display: none !important; }

.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 1rem;
  height: 52px;
  padding: 0 14px;
  background: #202020;
  border-bottom: 1px solid #000;
  box-shadow: 0 1px 0 var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; flex: none; }
.brand-mark {
  position: relative;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: var(--accent);
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 2px solid #fff;
  border-radius: 2px;
  opacity: .9;
}
.brand-name { font-size: 14px; font-weight: 600; white-space: nowrap; }
.session-picker { display: flex; align-items: center; gap: .45rem; flex: 1; min-width: 0; max-width: 34rem; }
.session-picker label, .app-picker label { font-size: 12px; color: var(--muted); flex: none; }
.session-picker select, .app-picker select {
  min-width: 0;
  width: 100%;
  height: 30px;
  padding: 0 2rem 0 .6rem;
  appearance: none;
  -webkit-appearance: none;
  background:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%) calc(100% - 14px) 13px / 5px 5px no-repeat,
    linear-gradient(135deg, var(--muted) 50%, transparent 50%) calc(100% - 9px) 13px / 5px 5px no-repeat,
    var(--panel-2);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}
.session-picker select:hover, .app-picker select:hover { border-color: #5c5c5c; }
.session-picker select:focus-visible, .app-picker select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
.app-picker { display: flex; align-items: center; gap: .45rem; flex: none; }
.app-picker select { width: auto; min-width: 9rem; }
.record-controls {
  display: flex;
  align-items: center;
  gap: .7rem;
  margin-left: auto;
  flex: none;
}
.record-state { display: flex; align-items: center; gap: .4rem; font-size: 12px; color: var(--muted); white-space: nowrap; }
.record-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); }
.record-controls[data-live-state="running"] .record-state .record-dot { background: var(--record); box-shadow: 0 0 0 2px rgba(229, 72, 77, .2); }
.record-controls[data-live-test="1"][data-live-state="running"] .record-state .record-dot { background: var(--test); box-shadow: 0 0 0 2px rgba(63, 185, 80, .2); }
.record-controls[data-live-state="starting"] .record-state .record-dot { background: var(--amber); }
.mode-note { font-size: 11px; color: var(--dim); white-space: nowrap; }
.record-btn, .test-btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  height: 30px;
  padding: 0 .8rem;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}
.record-btn { border-color: #5a3a3b; }
.record-btn .record-dot { background: var(--record); }
.record-btn:hover:not(:disabled) { background: #3a2b2c; }
.test-btn { border-color: #2f5a3a; }
.test-btn .record-dot { background: var(--test); }
.test-btn:hover:not(:disabled) { background: #263a2b; }
.record-btn[data-active="1"], .test-btn[data-active="1"] { background: var(--panel-3); border-color: #5c5c5c; }
.record-btn:disabled, .test-btn:disabled { opacity: .45; }
.live-session-link { font-size: 12px; white-space: nowrap; }
.manage-btn {
  flex: none;
  height: 30px;
  padding: 0 .8rem;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}
.manage-btn:hover:not(:disabled) { background: var(--panel-3); }

.notice {
  margin: 12px 16px 0;
  padding: 8px 12px;
  border: 1px solid rgba(229, 72, 77, .45);
  border-left: 3px solid var(--record);
  border-radius: 4px;
  background: rgba(229, 72, 77, .08);
  color: #ffb4b6;
  font-size: 12px;
}
.notice strong { color: #ff8a8d; }

.shell { max-width: 1500px; margin: 0 auto; padding: 14px 16px 24px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .5rem 1.5rem;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.panel-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .65rem; min-width: 0; }
.eyebrow {
  width: 100%;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--dim);
  text-transform: uppercase;
}
.panel-title h2 { font-size: 16px; letter-spacing: .02em; }
.session-tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.readout { display: flex; gap: 1.4rem; }
.readout-item { display: flex; flex-direction: column; gap: .1rem; min-width: 3.6rem; }
.readout-label { font-size: 11px; color: var(--dim); }
.readout-value { font-family: var(--font-mono); font-size: 16px; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--text); }

.viewer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 14px;
  padding: 14px;
  align-items: start;
}
.viewer-main { min-width: 0; }
.stage-shell { min-width: 0; }
.stage-bezel {
  display: flex;
  justify-content: center;
  padding: 8px;
  background: #101010;
  border: 1px solid #000;
  border-radius: 4px;
}
.stage {
  position: relative;
  display: inline-block;
  max-width: 100%;
  background: #000;
  overflow: hidden;
  border-radius: 2px;
  user-select: none;
  touch-action: none;
  cursor: crosshair;
}
.stage.is-empty {
  display: flex;
  width: 100%;
  min-height: 20rem;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.stage img,
.stage canvas { display: block; max-width: 100%; max-height: 66vh; width: auto; height: auto; }
.stage-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .4rem;
  padding: 2rem 1rem;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.stage-empty-mark { font-size: 26px; color: #555; line-height: 1; }
.stage-empty-sub { font-size: 12px; color: var(--dim); }
.overlay-layer { position: absolute; inset: 0; pointer-events: none; }
.selection-box {
  position: absolute;
  border: 1px dashed #f0b45a;
  background: rgba(240, 180, 90, .14);
}
.diff-box {
  position: absolute;
  border: 1px solid var(--red);
  background: rgba(229, 72, 77, .13);
}
.diff-box.reference {
  border-style: dashed;
  border-color: var(--blue);
  background: rgba(77, 157, 224, .12);
}
.stage-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}
.hud-frame { display: flex; align-items: baseline; gap: 5px; }
.hud-label { font-size: 11px; letter-spacing: .06em; color: var(--dim); }
.hud-number { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.hud-sep, .hud-total { color: var(--dim); font-variant-numeric: tabular-nums; }
.hud-time { color: var(--muted); white-space: nowrap; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; }
.transport-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  flex: none;
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  transition: background .12s, border-color .12s;
}
.transport-btn:hover:not(:disabled) { background: var(--panel-3); border-color: #5c5c5c; }
.transport-range { display: flex; flex: 1 1 12rem; flex-direction: column; gap: 2px; min-width: 8rem; }
input[type="range"] {
  -webkit-appearance: none;
          appearance: none;
  width: 100%;
  height: 20px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  --fill: 0%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0 var(--fill), #4a4a4a var(--fill) 100%);
  border-radius: 2px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4.5px;
  background: #e8e8e8;
  border: 0;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
input[type="range"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
input[type="range"]::-moz-range-track { height: 3px; background: #4a4a4a; border-radius: 2px; }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--accent); border-radius: 2px; }
input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: #e8e8e8;
  border: 0;
  border-radius: 50%;
}
.ticks { display: flex; justify-content: space-between; padding: 0 6px; }
.ticks i { width: 1px; height: 3px; background: #4a4a4a; }
.transport-readout {
  padding-left: 10px;
  border-left: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  white-space: nowrap;
}
.transport-time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.muted { color: var(--muted); }
.hint { margin: .35rem 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

.viewer-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side-block {
  padding: 10px;
  background: #1f1f1f;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.side-head { display: flex; align-items: baseline; gap: .45rem; margin-bottom: 8px; }
.side-head .index { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.side-head h3 { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.side-note { margin-left: auto; font-size: 10px; color: var(--dim); }
.toggle { display: flex; align-items: flex-start; gap: .5rem; font-size: 12px; cursor: pointer; }
input[type="checkbox"] {
  -webkit-appearance: none;
          appearance: none;
  position: relative;
  flex: none;
  width: 14px;
  height: 14px;
  margin: .15rem 0 0;
  background: #1b1b1b;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  cursor: pointer;
}
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 3px;
  height: 7px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
input[type="checkbox"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.snapshots { display: flex; flex-direction: column; gap: 5px; }
.snapshots-strip {
  margin-top: 10px;
  padding: 8px 10px;
  background: #1f1f1f;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.snapshots-strip .side-head { margin-bottom: 6px; }
.snapshots-strip .snapshot-back { margin-left: auto; }
.snapshots-strip .snapshots {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 6px;
  padding-bottom: 4px;
}
.snapshots-strip .snapshot {
  display: flex;
  flex: 1 1 110px;
  flex-direction: column;
  gap: 3px;
  max-width: 180px;
  padding: 4px;
}
.snapshots-strip .snapshot-thumb { width: 100%; height: 64px; }
.snapshots-strip .snapshot-num { font-size: 9px; }
.snapshots-strip .snapshot-label { max-width: 100%; font-size: 11px; }
.snapshot {
  display: grid;
  grid-template-columns: 64px auto minmax(0, 1fr);
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 4px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  text-align: left;
  transition: background .12s, border-color .12s;
}
.snapshot:hover { background: #262626; border-color: var(--line-strong); }
.snapshot.active { border-color: var(--accent); background: var(--accent-wash); }
.snapshot-thumb {
  display: block;
  width: 64px;
  height: 38px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.snapshot-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: .8; }
.snapshot-num { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.snapshot-label { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.snapshot.active .snapshot-num { color: var(--accent); }

#annotation-form {
  margin: 2px 0 8px;
  padding: 9px;
  background: #1b1b1b;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.field { display: block; margin: 7px 0; font-size: 11px; color: var(--muted); }
.field input, .field textarea {
  width: 100%;
  margin-top: 4px;
  padding: 6px 8px;
  background: #232323;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color .12s, box-shadow .12s;
}
.field input:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-wash);
}
.field textarea { min-height: 3.5rem; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.draw-tools { display: flex; flex-wrap: wrap; gap: 4px; }
.draw-tools button,
.wb-tools button {
  height: 26px;
  padding: 0 .5rem;
  background: #232323;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
}
.draw-tools button:hover,
.wb-tools button:hover { background: #2d2d2d; }
.draw-tools button.on,
.wb-tools button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.color-palette { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.draw-options .color-palette button,
.wb-tools .color-palette button {
  width: 18px;
  height: 18px;
  padding: 0;
  background: var(--swatch);
  border: 1px solid rgba(255, 255, 255, .28);
  border-radius: 50%;
  cursor: pointer;
}
.draw-options .color-palette button:hover,
.wb-tools .color-palette button:hover { transform: scale(1.12); }
.draw-options .color-palette button.on,
.wb-tools .color-palette button.on {
  box-shadow: 0 0 0 2px #181818, 0 0 0 3px var(--accent);
}
.draw-options { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; }
.draw-options .small, .wb-tools .small {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--muted);
}
.draw-options input[type="range"] { width: 72px; }
.wb-tools input[type="range"] { width: 64px; }
.draw-options input[type="number"],
.wb-tools input[type="number"] {
  width: 48px;
  height: 24px;
  padding: 0 4px;
  background: #232323;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 11px;
}
.mini-btn {
  height: 24px;
  padding: 0 .5rem;
  background: #232323;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 11px;
}
.mini-btn:hover { background: #2d2d2d; }
.side-actions { display: flex; gap: 4px; margin-left: auto; }
.range-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 7px 0; }
.range-chip {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.range-chip.is-set { color: var(--text); border-color: var(--accent); }
.mini-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }

#draw-layer { position: absolute; inset: 0; z-index: 6; }
#draw-layer .canvas-container {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
}
#draw-layer .canvas-container canvas {
  display: block !important;
  width: 100% !important;
  height: 100% !important;
}
#replay[data-live-state="starting"] #draw-layer,
#replay[data-live-state="running"] #draw-layer,
#replay[data-has-frames="0"] #draw-layer,
#draw-layer[hidden] { display: none !important; }

.wb-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, .68);
}
.wb-overlay[hidden] { display: none !important; }
.wb-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(980px, 100%);
  max-height: calc(100vh - 40px);
  overflow: auto;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}
.wb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.wb-head h3 { font-size: 14px; }
.wb-head .ghost-btn { margin-left: auto; }
.wb-scope { display: flex; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 4px; }
.wb-scope button {
  height: 26px;
  padding: 0 .6rem;
  background: #232323;
  border: 0;
  color: var(--muted);
  font-size: 12px;
}
.wb-scope button.on { background: var(--accent); color: #fff; }
.wb-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.wb-stage { align-self: center; max-width: 100%; overflow: hidden; background: #fff; border-radius: 4px; }
.wb-stage canvas { display: block; max-width: 100%; height: auto; }
.wb-foot { display: flex; align-items: center; gap: 8px; }
.wb-foot .hint { margin: 0 auto 0 0; }
.wb-refs { display: flex; flex-direction: column; gap: 5px; }
.wb-ref {
  position: relative;
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 4px 24px 4px 4px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.wb-ref:hover { background: #262626; border-color: var(--line-strong); }
.wb-ref-delete {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 18px;
  height: 18px;
  padding: 0;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--dim);

.colophon {

}

/* Live and replay frames swap without animation; the viewer is evidence, not
 * decoration. Keep this section free of @keyframes. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }

@media (max-width: 1080px) {

{{APP_MANAGER_HTML}}
<script src="/static/fabric.min.js"></script>
<script>
const MODEL = {{MODEL_JSON}};
(function () {
  "use strict";

  // Injected from console/web/wire.py: one definition shared with the Python
  // encoder for the raw preview stream and the page heartbeat.
  const LIVE_WIRE = {{LIVE_WIRE_JSON}};

  const $ = function (id) { return document.getElementById(id); };

  function sessionUrl(id) {
    return "/?session=" + encodeURIComponent(id);
  }

  const PAGE_ID = (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : "page-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

  function pageBeacon(path, useBeacon) {
    const body = JSON.stringify({ id: PAGE_ID });
    if (useBeacon && navigator.sendBeacon) {
      try {
        navigator.sendBeacon(path, new Blob([body], { type: "application/json" }));
        return;
      } catch (error) { }
    }
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body,
      cache: "no-store",
      keepalive: true
    }).catch(function () { /* the server may already be gone */ });
  }

  let pageHeartbeat = null;
  function startPageHeartbeat() {
    if (pageHeartbeat) return;
    pageHeartbeat = setInterval(function () {
      pageBeacon("/api/page/open", false);
    }, LIVE_WIRE.heartbeatMs);
  }

  pageBeacon("/api/page/open", false);
  startPageHeartbeat();
  window.addEventListener("pagehide", function () {
    if (pageHeartbeat) {
      clearInterval(pageHeartbeat);
      pageHeartbeat = null;
    }
    pageBeacon("/api/page/close", true);
  });
  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      pageBeacon("/api/page/open", false);
      startPageHeartbeat();
    }
  });

  const sessionId = MODEL.sessionId;
  const frames = Array.isArray(MODEL.frames) ? MODEL.frames : [];
  const diffRows = MODEL.diffs || {};
  const refDiffRows = MODEL.refDiffs || {};
  let frameIndex = 0;
  let snapshotMode = null;
  let notesCount = MODEL.notesCount || 0;
  let drawTool = "paint";
  let drawShape = null;
  let drawHistory = [];
  let drawRedo = [];
  let drawTextGuard = false;
  let drawBoard = null;
  let drawLayer = null;
  let drawColor = "#00c8ff";
  let rangeStart = null;
  let rangeEnd = null;
  let wbBoard = null;
  let wbTool = "paint";
  let wbColor = "#111111";
  let wbShape = null;
  let wbHistory = [];
  let wbRedo = [];
  let wbScope = "frame";
  let wbCurrentId = null;
  let wbItems = {};
  let wbDirty = false;
  let wbLoading = false;
  let wbVisible = false;
  let liveMode = false;
  let liveTestMode = false;
  let liveRequestToken = 0;
  let liveSessionId = null;
  let previousLiveSessionId = null;
  let liveRunning = false;
  let liveStarting = false;
  let liveSwitching = false;
  let liveHasFrame = false;
  let liveFrameNo = null;
  let liveFrameTMs = 0;
  let liveFrameCount = 0;
  let liveStreamAbort = null;
  let liveStreamToken = 0;
  let liveStreamRetry = null;
  let liveHudAt = 0;

  const img = $("frame-image");
  // Decode replay frames off-DOM and swap only when ready. Assigning a new
  // <img> src during rapid slider scrubbing briefly exposes the stage's black
  // background while the PNG loads; preloading removes that gap.
  const replayLoader = new Image();
  let replayLoadToken = 0;
  const stage = $("stage");
  drawLayer = $("draw-layer");
  const diffLayer = $("diff-layer");
  const slider = $("frame-slider");
  const positionEl = $("frame-position");
  const timeEl = $("frame-time");
  const diffToggle = $("diff-toggle");
  const diffNote = $("diff-note");
  const snapshotBack = $("snapshot-back");
  const saveButton = $("annotation-save");
  const textInput = $("annotation-text");
  const statusEl = $("annotation-status");
  const pendingSummary = $("pending-summary");
  const notesList = $("annotation-list");
  const annotationTotal = $("annotation-total");
  const frameTotal = $("frame-total");
  const hudLabel = $("hud-label");
  const hudFrameNo = $("hud-frame-no");
  const hudTotal = $("hud-frame-total");
  const hudTime = $("hud-time");
  const replayPanel = $("replay");
  const recordControls = $("record-controls");
  const modeNote = $("mode-note");
  const liveStatus = $("live-status");
  const liveSession = $("live-session");
  const liveApp = $("live-app");
  let lastLiveApp = liveApp ? liveApp.value : "";
{{APP_MANAGER_STATE_JS}}
  const liveCanvas = $("live-canvas");
  const liveCanvasCtx = liveCanvas ? liveCanvas.getContext("2d") : null;
  const stageEmpty = $("stage-empty");
  const stageEmptyText = $("stage-empty-text");
  const stageEmptySub = $("stage-empty-sub");

  function currentFrame() {
    return frames.length ? frames[frameIndex] : null;
  }

  function activeSurface() {
    if (!liveMode) return img;
    return liveHasFrame ? liveCanvas : null;
  }

  function activeFrame() {
    return liveMode ? null : currentFrame();
  }

  function padFrame(no) {
    const text = String(no);
    return text.length >= 4 ? text : ("0000" + text).slice(-4);
  }

  function setHud(label, no, total, time) {
    if (hudLabel) hudLabel.textContent = label;
    if (hudFrameNo) hudFrameNo.textContent = no;
    if (hudTotal) hudTotal.textContent = String(total);
    if (hudTime) hudTime.textContent = time;
  }

  function updateSliderFill() {
    if (!slider) return;
    const max = Number(slider.max) || 1;
    const value = Number(slider.value) || 1;
    const pct = max > 1 ? ((value - 1) / (max - 1)) * 100 : 100;
    slider.style.setProperty("--fill", pct + "%");
  }

  function currentFrameNo() {
    const frame = currentFrame();
    return frame ? frame.frame_no : null;
  }

  function tMsForFrame(frameNo) {
    const frame = frames.find(function (f) { return f.frame_no === frameNo; });
    return frame ? (frame.t_ms || 0) : 0;
  }

  function drawableObjects() {
    if (!drawBoard) return [];
    return drawBoard.getObjects().filter(function (o) { return o.annotationTool; });
  }

  function unsavedObjects() {
    return drawableObjects().filter(function (o) { return !o.saved; });
  }

  function updateSaveState() {
    if (!saveButton) return;
    const hasText = textInput ? textInput.value.trim().length > 0 : false;
    const hasObjects = unsavedObjects().length > 0;
    saveButton.disabled = liveMode || !activeFrame() || !MODEL.annotationsUrl ||
      snapshotMode !== null ||
      (!hasText && !hasObjects && rangeStart === null);
  }

  function rangeLabelText() {
    if (rangeStart === null) return "单帧";
    if (rangeEnd === null) return "起点帧 " + rangeStart + "，未设终点";
    return "范围 " + Math.min(rangeStart, rangeEnd) + "–" +
      Math.max(rangeStart, rangeEnd);
  }

  function updateRangeUI() {
    const current = currentFrameNo();
    const currentChip = $("range-current");
    const startChip = $("range-start-chip");
    const endChip = $("range-end-chip");
    if (currentChip) {
      currentChip.textContent = "当前帧 " + (current === null ? "—" : current);
    }
    if (startChip) {
      startChip.textContent = "起点：" + (rangeStart === null ? "未设" : "帧 " + rangeStart);
      startChip.classList.toggle("is-set", rangeStart !== null);
    }
    if (endChip) {
      endChip.textContent = "终点：" + (rangeEnd === null ? "未设" : "帧 " + rangeEnd);
      endChip.classList.toggle("is-set", rangeEnd !== null);
    }
    const startButton = $("range-start");
    const endButton = $("range-end");
    if (startButton) {
      startButton.classList.toggle("on", rangeStart !== null && rangeStart === current);
    }
    if (endButton) {
      endButton.classList.toggle("on", rangeEnd !== null && rangeEnd === current);
    }
    const clear = $("range-clear");
    if (clear) clear.hidden = rangeStart === null && rangeEnd === null;
  }

  function updatePendingSummary() {
    if (!pendingSummary) return;
    const objects = drawableObjects();
    const pending = unsavedObjects();
    const framesSeen = {};
    for (const obj of pending) framesSeen[obj.annotationFrame] = true;
    const anchorCount = Object.keys(framesSeen).length;
    const parts = [];
    if (anchorCount) parts.push(anchorCount + " 个锚点帧");
    if (pending.length) parts.push(pending.length + " 个待保存对象");
    if (objects.length > pending.length) {
      parts.push("已保存 " + (objects.length - pending.length) + " 个");
    }
    if (rangeStart !== null) parts.push(rangeLabelText());
    pendingSummary.textContent = parts.join(" · ");
    pendingSummary.hidden = parts.length === 0;
    updateRangeUI();
    updateSaveState();
  }

  function renderDiff() {
    if (!diffLayer) return;
    diffLayer.textContent = "";
    const on = Boolean(diffToggle && diffToggle.checked) && !liveMode;
    diffLayer.hidden = !on;
    if (!on) {
      if (diffNote) diffNote.textContent = "diff 默认关闭。";
      return;
    }
    const frame = currentFrame();
    if (!frame || snapshotMode) {
      if (diffNote) diffNote.textContent = "当前不在帧视图，没有可覆盖的 diff。";
      return;
    }
    const row = diffRows[String(frame.frame_no)];
    const reference = refDiffRows[String(frame.frame_no)];
    if (!row && !reference) {
      if (diffNote) diffNote.textContent = "当前帧没有 diff 行（首帧不写 diff）。";
      return;
    }
    const parts = [];
    if (addDiffBox(diffLayer, row, "")) {
      parts.push("帧间 diff：changed_px=" + row.changed_px + "，max_delta=" + row.max_delta);
    }
    if (addDiffBox(diffLayer, reference, "reference")) {
      parts.push("参考图 diff：changed_px=" + reference.changed_px + "，max_delta=" + reference.max_delta);
    }
    if (diffNote) diffNote.textContent = parts.join("；") || "当前帧没有可覆盖的 bbox。";
  }

  function addDiffBox(layer, row, className) {
    if (!row || !row.bbox) return false;
    const width = row.width || (img && img.naturalWidth) || 0;
    const height = row.height || (img && img.naturalHeight) || 0;
    if (!width || !height) return false;
    const box = document.createElement("div");
    box.className = "diff-box" + (className ? " " + className : "");
    box.style.left = (row.bbox.x / width * 100) + "%";
    box.style.top = (row.bbox.y / height * 100) + "%";
    box.style.width = (row.bbox.w / width * 100) + "%";
    box.style.height = (row.bbox.h / height * 100) + "%";
    box.title = "changed_px=" + row.changed_px + ", max_delta=" + row.max_delta;
    layer.appendChild(box);
    return true;
  }

  function clearSnapshotActive() {
    document.querySelectorAll("button.snapshot.active").forEach(function (button) {
      button.classList.remove("active");
    });
  }

  function swapReplayImage(url) {
    if (!img) return;
    img.hidden = false;
    if (img.getAttribute("src") === url) return;
    const token = ++replayLoadToken;
    const apply = function () {
      if (token !== replayLoadToken) return;
      if (img.getAttribute("src") !== url) img.src = url;
    };
    replayLoader.onload = apply;
    replayLoader.onerror = apply;
    replayLoader.src = url;
    if (replayLoader.decode) {
      replayLoader.decode().then(apply).catch(function () {});
    }
  }

  function showFrame(index) {
    if (liveMode || !frames.length) return;
    frameIndex = Math.max(0, Math.min(frames.length - 1, index));
    snapshotMode = null;
    const frame = frames[frameIndex];
    if (img) {
      swapReplayImage(frame.url);
      img.alt = "第 " + frame.frame_no + " 帧";
      // The viewer swaps frames without any fade or flash. Keep it that way:
      // the range slider emits input events at pointer speed.
    }
    if (slider) slider.value = String(frameIndex + 1);
    updateSliderFill();
    if (positionEl) positionEl.textContent = (frameIndex + 1) + " / " + MODEL.frameCount;
    if (timeEl) timeEl.textContent = "t=" + (frame.t_ms || 0) + " ms";
    setHud("FRAME", padFrame(frame.frame_no), MODEL.frameCount, "t = " + (frame.t_ms || 0) + " ms");
    if (frameTotal) frameTotal.textContent = String(MODEL.frameCount);
    if (snapshotBack) snapshotBack.hidden = true;
    clearSnapshotActive();
    renderDiff();
    syncBoardFrame();
    updatePendingSummary();
  }

  function showSnapshot(entry) {
    if (!img || liveMode) return;
    snapshotMode = entry;
    swapReplayImage(entry.url);
    img.alt = "关键画面 " + entry.label;
    if (positionEl) positionEl.textContent = "关键画面";
    if (timeEl) timeEl.textContent = entry.label;
    setHud("SNAPSHOT", "—", MODEL.frameCount, entry.label);
    if (snapshotBack) snapshotBack.hidden = false;
    document.querySelectorAll("button.snapshot").forEach(function (button) {
      button.classList.toggle(
        "active",
        button.getAttribute("data-snapshot-url") === entry.url
      );
    });
    if (drawLayer) drawLayer.hidden = true;
    updatePendingSummary();
    renderDiff();
  }


  const SHAPE_TOOLS = { rect: 1, ellipse: 1, line: 1, arrow: 1, highlight: 1 };

  function hexToRgba(hex, alpha) {
    const value = hex.replace("#", "");
    const r = parseInt(value.slice(0, 2), 16);
    const g = parseInt(value.slice(2, 4), 16);
    const b = parseInt(value.slice(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  const CropLogic = (function () {
    function stampDisk(mask, mw, mh, cx, cy, r) {
      const x0 = Math.max(0, Math.floor(cx - r));
      const x1 = Math.min(mw - 1, Math.ceil(cx + r));
      const y0 = Math.max(0, Math.floor(cy - r));
      const y1 = Math.min(mh - 1, Math.ceil(cy + r));
      const r2 = r * r;
      for (let y = y0; y <= y1; y++) {
        const dy = y - cy;
        for (let x = x0; x <= x1; x++) {
          const dx = x - cx;
          if (dx * dx + dy * dy <= r2) mask[y * mw + x] = 1;
        }
      }
    }

    function stampLine(mask, mw, mh, x0, y0, x1, y1, r) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 0.5));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        stampDisk(mask, mw, mh, x0 + dx * t, y0 + dy * t, r);
      }
    }

    function dilate(mask, mw, mh, iterations) {
      let cur = mask;
      for (let it = 0; it < iterations; it++) {
        const next = new Uint8Array(cur.length);
        for (let y = 0; y < mh; y++) {
          const row = y * mw;
          for (let x = 0; x < mw; x++) {
            const i = row + x;
            if (cur[i]) { next[i] = 1; continue; }
            if ((x > 0 && cur[i - 1]) || (x < mw - 1 && cur[i + 1]) ||
                (y > 0 && cur[i - mw]) || (y < mh - 1 && cur[i + mw])) {
              next[i] = 1;
            }
          }
        }
        cur = next;
      }
      return cur;
    }

    function connectedComponents(mask, w, h, minArea) {
      const seen = new Uint8Array(mask.length);
      const queue = new Int32Array(mask.length);
      const comps = [];
      for (let start = 0; start < mask.length; start++) {
        if (!mask[start] || seen[start]) continue;
        let head = 0;
        let tail = 0;
        queue[tail++] = start;
        seen[start] = 1;
        let minX = w, minY = h, maxX = -1, maxY = -1, area = 0;
        while (head < tail) {
          const p = queue[head++];
          const x = p % w;
          const y = (p / w) | 0;
          area++;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          if (x > 0 && mask[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; queue[tail++] = p - 1; }
          if (x < w - 1 && mask[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; queue[tail++] = p + 1; }
          if (y > 0 && mask[p - w] && !seen[p - w]) { seen[p - w] = 1; queue[tail++] = p - w; }
          if (y < h - 1 && mask[p + w] && !seen[p + w]) { seen[p + w] = 1; queue[tail++] = p + w; }
        }
        if (area >= minArea) {
          comps.push({ x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1, area: area });
        }
      }
      return comps;
    }

    function strokesToRegions(strokes, w, h) {
      const scale = 0.5;
      const mw = Math.max(1, Math.round(w * scale));
      const mh = Math.max(1, Math.round(h * scale));
      const mask = new Uint8Array(mw * mh);
      for (const stroke of strokes) {
        const points = stroke.points;
        if (!points.length) continue;
        const r = Math.max(0.8, (stroke.size * scale) / 2);
        if (points.length === 1) {
          stampDisk(mask, mw, mh, points[0].x * scale, points[0].y * scale, r);
          continue;
        }
        for (let i = 1; i < points.length; i++) {
          stampLine(
            mask, mw, mh,
            points[i - 1].x * scale, points[i - 1].y * scale,
            points[i].x * scale, points[i].y * scale, r
          );
        }
      }
      const grown = dilate(mask, mw, mh, 4);
      const comps = connectedComponents(grown, mw, mh, 24);
      const pad = 3;
      return comps.map(function (comp) {
        const x = Math.max(0, Math.floor(comp.x / scale) - pad);
        const y = Math.max(0, Math.floor(comp.y / scale) - pad);
        const x2 = Math.min(w, Math.ceil((comp.x + comp.w) / scale) + pad);
        const y2 = Math.min(h, Math.ceil((comp.y + comp.h) / scale) + pad);
        return { x: x, y: y, w: x2 - x, h: y2 - y };
      }).sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });
    }

    return { strokesToRegions: strokesToRegions };
  })();

  function arrowPath(x1, y1, x2, y2) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const head = 12;
    const a1 = angle + Math.PI * 0.85;
    const a2 = angle - Math.PI * 0.85;
    return "M " + x1 + " " + y1 + " L " + x2 + " " + y2 +
      " M " + (x2 + Math.cos(a1) * head) + " " + (y2 + Math.sin(a1) * head) + " L " + x2 + " " + y2 +
      " L " + (x2 + Math.cos(a2) * head) + " " + (y2 + Math.sin(a2) * head);
  }

  function makeShape(kind, a, b, color) {
    const stroke = color || drawColor;
    const left = Math.min(a.x, b.x);
    const top = Math.min(a.y, b.y);
    const width = Math.abs(b.x - a.x);
    const height = Math.abs(b.y - a.y);
    if (kind === "rect" || kind === "highlight") {
      return new fabric.Rect({
        left: left,
        top: top,
        width: width,
        height: height,
        fill: hexToRgba(stroke, kind === "highlight" ? 0.35 : 0.06),
        stroke: kind === "highlight" ? "" : stroke,
        strokeWidth: kind === "highlight" ? 0 : 2,
        strokeUniform: true
      });
    }
    if (kind === "ellipse") {
      return new fabric.Ellipse({
        left: left,
        top: top,
        rx: width / 2,
        ry: height / 2,
        fill: hexToRgba(stroke, 0.06),
        stroke: stroke,
        strokeWidth: 2,
        strokeUniform: true
      });
    }
    if (kind === "line") {
      return new fabric.Line([a.x, a.y, b.x, b.y], {
        stroke: stroke,
        strokeWidth: 2,
        strokeUniform: true
      });
    }
    return new fabric.Path(arrowPath(a.x, a.y, b.x, b.y), {
      stroke: stroke,
      strokeWidth: 2,
      fill: "",
      strokeUniform: true
    });
  }

  function bindShapeToFrame(obj, frameNo) {
    obj.annotationTool = obj.annotationTool || "shape";
    obj.annotationFrame = frameNo;
    obj.selectable = false;
    obj.evented = false;
    obj.lockRotation = true;
    obj.hasControls = false;
  }

  function initDrawBoard() {
    if (drawBoard || !drawLayer) return;
    if (typeof fabric === "undefined") {
      if (statusEl) {
        statusEl.textContent = "画板脚本未加载，请刷新页面或重启检视台。";
      }
      return;
    }
    drawBoard = new fabric.Canvas("draw-canvas", {
      selection: false,
      preserveObjectStacking: true,
      backgroundColor: null
    });
    drawBoard.isDrawingMode = true;
    drawBoard.freeDrawingBrush = new fabric.PencilBrush(drawBoard);
    drawBoard.freeDrawingBrush.color = drawColor;
    const sizeInput = $("draw-size");
    drawBoard.freeDrawingBrush.width = sizeInput ? Number(sizeInput.value) || 6 : 6;

    drawBoard.on("path:created", function (event) {
      const path = event.path;
      path.annotationTool = "paint";
      path.annotationKind = "stroke";
      path.annotationFrame = currentFrameNo();
      path.selectable = false;
      path.evented = false;
      path.strokeUniform = true;
      recordDrawAdd(path);
      updatePendingSummary();
    });
    drawBoard.on("mouse:down", onDrawDown);
    drawBoard.on("mouse:move", onDrawMove);
    drawBoard.on("mouse:up", onDrawUp);
    drawBoard.on("object:modified", function (opt) {
      if (opt && opt.target) opt.target.saved = false;
      updatePendingSummary();
    });

    initWhiteboard();
    layoutDrawBoard();
    window.addEventListener("resize", layoutDrawBoard);
    if (img) {
      img.addEventListener("load", function () {
        layoutDrawBoard();
        syncBoardFrame();
      });
    }
    loadWhiteboards();
  }

  function layoutDrawBoard() {
    if (!drawBoard || !stage) return;
    const rect = stage.getBoundingClientRect();
    const width = Math.max(1, Math.round(rect.width));
    const height = Math.max(1, Math.round(rect.height));
    const oldWidth = drawBoard.getWidth();
    const oldHeight = drawBoard.getHeight();
    if (width === oldWidth && height === oldHeight) return;
    if (oldWidth > 1 && oldHeight > 1 && drawBoard.getObjects().length) {
      const sx = width / oldWidth;
      const sy = height / oldHeight;
      for (const obj of drawBoard.getObjects()) {
        obj.left *= sx;
        obj.top *= sy;
        obj.scaleX *= sx;
        obj.scaleY *= sy;
        if (obj.type === "i-text" || obj.type === "textbox") {
          obj.fontSize *= (sx + sy) / 2;
        }
        obj.setCoords();
      }
    }
    drawBoard.setDimensions({ width: width, height: height });
    drawBoard.calcOffset();
    drawBoard.requestRenderAll();
  }

  function drawLayerVisible() {
    return !liveMode && !snapshotMode && !!activeFrame() && frames.length > 0;
  }

  function syncBoardFrame() {
    if (!drawBoard) return;
    layoutDrawBoard();
    if (drawLayer) drawLayer.hidden = !drawLayerVisible();
    const frameNo = currentFrameNo();
    drawBoard.getObjects().forEach(function (obj) {
      const visible = obj.annotationFrame === frameNo;
      const isText = obj.type === "i-text" || obj.type === "textbox";
      const canEdit = visible && drawLayerVisible() && isText && drawTool === "text";
      obj.visible = visible;
      obj.selectable = canEdit;
      obj.evented = canEdit;
      obj.editable = canEdit;
    });
    drawBoard.discardActiveObject();
    drawBoard.requestRenderAll();
    updatePendingSummary();
    updateRangeUI();
    renderWbRefs();
  }

  function onDrawDown(opt) {
    if (!drawLayerVisible() || opt.target) return;
    if (drawTool === "paint") return;
    const point = drawBoard.getPointer(opt.e);
    const frameNo = currentFrameNo();
    if (SHAPE_TOOLS[drawTool]) {
      const obj = makeShape(drawTool, point, point);
      bindShapeToFrame(obj, frameNo);
      drawShape = { kind: drawTool, start: point, last: point, obj: obj };
      drawBoard.add(obj);
      drawBoard.requestRenderAll();
      return;
    }
    if (drawTool !== "text" || drawTextGuard) return;
    const fontSize = Number(($("draw-font-size") || {}).value) || 18;
    const text = new fabric.IText("说明", {
      left: point.x,
      top: point.y,
      fontSize: fontSize,
      fill: drawColor,
      fontFamily: '"Microsoft YaHei", sans-serif',
      padding: 4
    });
    text.annotationTool = "text";
    text.annotationFrame = frameNo;
    text.selectable = true;
    text.evented = true;
    text.editable = true;
    drawBoard.add(text);
    recordDrawAdd(text);
    drawBoard.setActiveObject(text);
    text.enterEditing();
    text.selectAll();
    text.on("editing:exited", function () {
      drawTextGuard = true;
      setTimeout(function () { drawTextGuard = false; }, 0);
      text.saved = false;
      text.selectable = false;
      text.evented = false;
      text.editable = false;
      if (!text.text.trim()) {
        drawBoard.remove(text);
      }
      updatePendingSummary();
    });
  }

  function onDrawMove(opt) {
    if (!drawShape) return;
    const point = drawBoard.getPointer(opt.e);
    const shape = drawShape;
    shape.last = point;
    if (shape.kind === "line" || shape.kind === "arrow") {
      const index = drawBoard.getObjects().indexOf(shape.obj);
      drawBoard.remove(shape.obj);
      const next = makeShape(shape.kind, shape.start, point);
      bindShapeToFrame(next, shape.obj.annotationFrame);
      drawBoard.add(next);
      if (index >= 0 && index < drawBoard.getObjects().length) {
        drawBoard.moveTo(next, index);
      }
      shape.obj = next;
      drawBoard.requestRenderAll();
      return;
    }
    const left = Math.min(shape.start.x, point.x);
    const top = Math.min(shape.start.y, point.y);
    const width = Math.abs(point.x - shape.start.x);
    const height = Math.abs(point.y - shape.start.y);
    if (shape.kind === "ellipse") {
      shape.obj.set({ left: left, top: top, rx: width / 2, ry: height / 2 });
    } else {
      shape.obj.set({ left: left, top: top, width: width, height: height });
    }
    shape.obj.setCoords();
    drawBoard.requestRenderAll();
  }

  function onDrawUp() {
    if (!drawShape) return;
    const shape = drawShape;
    drawShape = null;
    const tiny = (shape.kind === "line" || shape.kind === "arrow")
      ? Math.hypot(shape.last.x - shape.start.x, shape.last.y - shape.start.y) < 8
      : ((shape.obj.width || 0) < 6 && (shape.obj.height || 0) < 6);
    if (tiny) {
      drawBoard.remove(shape.obj);
      drawBoard.requestRenderAll();
      return;
    }
    if (shape.kind === "highlight") {
      shape.obj.excludeFromAnnotations = true;
    }
    recordDrawAdd(shape.obj);
    drawBoard.requestRenderAll();
    updatePendingSummary();
  }

  function setDrawTool(key) {
    drawTool = key;
    drawShape = null;
    const tools = $("draw-tools");
    if (tools) {
      tools.querySelectorAll("button[data-draw-tool]").forEach(function (button) {
        button.classList.toggle("on", button.dataset.drawTool === key);
      });
    }
    if (!drawBoard) {
      if (statusEl) {
        statusEl.textContent = "画板脚本未加载，请刷新页面或重启检视台。";
      }
      return;
    }
    drawBoard.isDrawingMode = key === "paint";
    drawBoard.defaultCursor = key === "text" ? "text" : (SHAPE_TOOLS[key] ? "crosshair" : "default");
    const active = drawBoard.getActiveObject();
    if (active && active.isEditing) active.exitEditing();
    drawBoard.discardActiveObject();
    drawBoard.getObjects().forEach(function (obj) {
      const visible = obj.annotationFrame === currentFrameNo();
      const isText = obj.type === "i-text" || obj.type === "textbox";
      const canEdit = visible && isText && key === "text";
      obj.selectable = canEdit;
      obj.evented = canEdit;
      obj.editable = canEdit;
    });
    drawBoard.requestRenderAll();
  }

  function setDrawColor(color) {
    drawColor = color;
    const palette = $("draw-colors");
    if (palette) {
      palette.querySelectorAll("button[data-draw-color]").forEach(function (button) {
        button.classList.toggle("on", button.dataset.drawColor === color);
      });
    }
    if (drawBoard && drawBoard.freeDrawingBrush) {
      drawBoard.freeDrawingBrush.color = color;
    }
  }

  function recordDrawAdd(obj) {
    drawHistory.push({ op: "add", obj: obj });
    drawRedo = [];
  }

  function recordDrawRemove(obj) {
    drawHistory.push({ op: "remove", obj: obj });
    drawRedo = [];
  }

  function undoDraw() {
    const action = drawHistory.pop();
    if (!action || !drawBoard) return;
    if (action.op === "add") {
      if (drawBoard.contains(action.obj)) drawBoard.remove(action.obj);
    } else if (action.op === "remove") {
      drawBoard.add(action.obj);
    } else if (action.op === "clear") {
      action.objs.forEach(function (obj) { drawBoard.add(obj); });
    }
    drawRedo.push(action);
    drawBoard.requestRenderAll();
    syncBoardFrame();
  }

  function redoDraw() {
    const action = drawRedo.pop();
    if (!action || !drawBoard) return;
    if (action.op === "add") {
      drawBoard.add(action.obj);
    } else if (action.op === "remove") {
      if (drawBoard.contains(action.obj)) drawBoard.remove(action.obj);
    } else if (action.op === "clear") {
      action.objs.forEach(function (obj) {
        if (drawBoard.contains(obj)) drawBoard.remove(obj);
      });
    }
    drawHistory.push(action);
    drawBoard.requestRenderAll();
    syncBoardFrame();
  }

  function deleteSelectedDraw() {
    if (!drawBoard) return;
    const active = drawBoard.getActiveObjects();
    if (!active.length) return;
    active.forEach(function (obj) {
      recordDrawRemove(obj);
      drawBoard.remove(obj);
    });
    drawBoard.discardActiveObject();
    updatePendingSummary();
  }

  function clearDrawBoard() {
    if (!drawBoard) return;
    const objects = drawBoard.getObjects().filter(function (obj) { return obj.annotationTool; });
    if (objects.length && !window.confirm("清空所有帧上的标注草稿？")) return;
    const removed = drawBoard.getObjects().slice();
    drawBoard.remove.apply(drawBoard, removed);
    drawHistory = [];
    drawRedo = [];
    rangeStart = null;
    rangeEnd = null;
    if (textInput) textInput.value = "";
    if (statusEl) statusEl.textContent = "";
    drawBoard.requestRenderAll();
    updatePendingSummary();
  }

  function pathPoints(pathObj) {
    const out = [];
    for (const cmd of pathObj.path) {
      if (cmd[0] === "M" || cmd[0] === "L") out.push({ x: cmd[1], y: cmd[2] });
      else if (cmd[0] === "Q") out.push({ x: cmd[3], y: cmd[4] });
      else if (cmd[0] === "C") out.push({ x: cmd[5], y: cmd[6] });
    }
    return out;
  }

  function objectRegion(obj) {
    const rect = obj.getBoundingRect(true, true);
    const width = drawBoard.getWidth();
    const height = drawBoard.getHeight();
    const x = Math.max(0, Math.round(rect.left));
    const y = Math.max(0, Math.round(rect.top));
    const x2 = Math.min(width, Math.round(rect.left + rect.width));
    const y2 = Math.min(height, Math.round(rect.top + rect.height));
    if (x2 - x < 1 || y2 - y < 1) return null;
    return { x: x, y: y, w: x2 - x, h: y2 - y };
  }

  function boardScale() {
    const natural = img && img.naturalWidth ? img.naturalWidth : 0;
    const drawn = drawBoard ? drawBoard.getWidth() : 0;
    const naturalHeight = img && img.naturalHeight ? img.naturalHeight : 0;
    const drawnHeight = drawBoard ? drawBoard.getHeight() : 0;
    return {
      x: natural && drawn ? natural / drawn : 1,
      y: naturalHeight && drawnHeight ? naturalHeight / drawnHeight : 1
    };
  }

  function scaleBoardRegion(region, scale) {
    return {
      x: Math.max(0, Math.round(region.x * scale.x)),
      y: Math.max(0, Math.round(region.y * scale.y)),
      w: Math.max(1, Math.round(region.w * scale.x)),
      h: Math.max(1, Math.round(region.h * scale.y))
    };
  }

  function collectAnchors() {
    const result = { anchors: [], texts: [] };
    if (!drawBoard) return result;
    const scale = boardScale();
    const byFrame = {};
    const strokesByFrame = {};
    for (const obj of drawBoard.getObjects()) {
      if (!obj.annotationTool || obj.annotationFrame === null) continue;
      if (obj.saved) continue;
      if (obj.annotationKind === "stroke") {
        const list = strokesByFrame[obj.annotationFrame] || (strokesByFrame[obj.annotationFrame] = []);
        list.push({
          points: pathPoints(obj),
          size: (obj.strokeWidth || 6) * Math.abs(obj.scaleX || 1)
        });
        continue;
      }
      if (obj.excludeFromAnnotations) continue;
      const region = objectRegion(obj);
      if (!region) continue;
      (byFrame[obj.annotationFrame] || (byFrame[obj.annotationFrame] = [])).push(
        scaleBoardRegion(region, scale)
      );
      if (obj.type === "i-text" || obj.type === "textbox") {
        const text = (obj.text || "").trim();
        if (text) result.texts.push(text);
      }
    }
    for (const frameNo of Object.keys(strokesByFrame)) {
      const regions = CropLogic.strokesToRegions(
        strokesByFrame[frameNo], drawBoard.getWidth(), drawBoard.getHeight()
      );
      for (const region of regions) {
        (byFrame[frameNo] || (byFrame[frameNo] = [])).push(
          scaleBoardRegion(region, scale)
        );
      }
    }
    result.anchors = Object.keys(byFrame).map(Number).sort(function (a, b) {
      return a - b;
    }).map(function (frameNo) {
      return {
        frame_no: frameNo,
        t_ms: tMsForFrame(frameNo),
        regions: byFrame[frameNo]
      };
    });
    return result;
  }

  function loadFrameImage(url) {
    return new Promise(function (resolve, reject) {
      const image = new Image();
      image.onload = function () { resolve(image); };
      image.onerror = function () { reject(new Error("frame image unavailable")); };
      image.src = url;
    });
  }

  async function attachAnnotatedImages(anchors) {
    if (!drawBoard || !anchors.length) return;
    const active = drawBoard.getActiveObject();
    if (active && active.isEditing) active.exitEditing();
    drawBoard.discardActiveObject();
    for (const anchor of anchors) {
      const frame = frames.find(function (item) {
        return item.frame_no === anchor.frame_no;
      });
      if (!frame) continue;
      try {
        const image = await loadFrameImage(frame.url);
        const width = image.naturalWidth || image.width;
        const height = image.naturalHeight || image.height;
        if (!width || !height || !drawBoard.getWidth()) continue;
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0, width, height);
        const objects = drawBoard.getObjects();
        const visibility = objects.map(function (obj) { return obj.visible; });
        try {
          objects.forEach(function (obj) {
            obj.visible = !obj.saved && obj.annotationFrame === anchor.frame_no;
          });
          const overlay = drawBoard.toCanvasElement(width / drawBoard.getWidth());
          context.drawImage(overlay, 0, 0, width, height);
        } finally {
          objects.forEach(function (obj, index) {
            obj.visible = visibility[index];
          });
          drawBoard.calcOffset();
          drawBoard.requestRenderAll();
        }
        anchor.annotated = canvas.toDataURL("image/png");
      } catch (error) {
      }
    }
  }

  async function saveBoardNote() {
    const endpoint = MODEL.annotationsUrl;
    if (!endpoint || liveMode || snapshotMode || !activeFrame()) return;
    const collected = collectAnchors();
    await attachAnnotatedImages(collected.anchors);
    const typed = textInput ? textInput.value.trim() : "";
    const text = [
      typed,
      collected.texts.length ? "画布文字：" + collected.texts.join("；") : ""
    ].filter(function (part) { return part.length > 0; }).join("\n");
    const frameNos = collected.anchors.map(function (anchor) { return anchor.frame_no; });
    let frameStart = rangeStart === null
      ? (frameNos.length ? frameNos[0] : currentFrameNo())
      : rangeStart;
    let frameEnd = rangeEnd === null
      ? (rangeStart === null
        ? (frameNos.length ? frameNos[frameNos.length - 1] : frameStart)
        : currentFrameNo())
      : rangeEnd;
    if (frameNos.length) {
      frameStart = Math.min.apply(null, [frameStart].concat(frameNos));
      frameEnd = Math.max.apply(null, [frameEnd].concat(frameNos));
    }
    if (frameStart === null || frameEnd === null) return;
    if (frameStart > frameEnd) {
      const swap = frameStart;
      frameStart = frameEnd;
      frameEnd = swap;
    }
    if (!text && collected.anchors.length === 0 && rangeStart === null) {
      if (statusEl) statusEl.textContent = "先画几笔或写一句话，再保存。";
      updateSaveState();
      return;
    }
    const payload = {
      frame_no: collected.anchors.length ? collected.anchors[0].frame_no : frameStart,
      t_ms: collected.anchors.length
        ? collected.anchors[0].t_ms
        : tMsForFrame(frameStart),
      frame_start: frameStart,
      frame_end: frameEnd,
      anchors: collected.anchors,
      tags: [],
      text: text
    };
    saveButton.disabled = true;
    if (statusEl) statusEl.textContent = "保存中…";
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) {
        const message = data && data.error ? data.error.message : "HTTP " + response.status;
        if (statusEl) statusEl.textContent = "保存未完成：" + message;
        updateSaveState();
        return;
      }
      const note = data.note || {};
      const rangeText = note.frame_start !== note.frame_end
        ? "帧 " + note.frame_start + "–" + note.frame_end
        : "帧 " + note.frame_no;
      drawBoard.getObjects().forEach(function (obj) {
        if (obj.annotationTool) obj.saved = true;
      });
      drawHistory = [];
      drawRedo = [];
      rangeStart = null;
      rangeEnd = null;
      if (textInput) textInput.value = "";
      if (statusEl) {
        statusEl.textContent = "已保存标注 " + note.id + "（" + rangeText +
          "）；画面保留，可继续画新的。";
      }
      updatePendingSummary();
      await refreshNotes();
      notesCount += 1;
      if (annotationTotal) annotationTotal.textContent = String(notesCount);
    } catch (error) {
      if (statusEl) statusEl.textContent = "保存未完成：" + String(error);
    }
    updateSaveState();
  }

  function bindDrawTools() {
    const tools = $("draw-tools");
    if (tools) {
      tools.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-draw-tool]");
        if (button) setDrawTool(button.dataset.drawTool);
      });
    }
    const colors = $("draw-colors");
    if (colors) {
      colors.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-draw-color]");
        if (button) setDrawColor(button.dataset.drawColor);
      });
    }
    const sizeInput = $("draw-size");
    if (sizeInput) {
      sizeInput.addEventListener("input", function () {
        if (drawBoard) drawBoard.freeDrawingBrush.width = Number(sizeInput.value) || 6;
      });
    }
    const undo = $("draw-undo");
    if (undo) undo.addEventListener("click", undoDraw);
    const redo = $("draw-redo");
    if (redo) redo.addEventListener("click", redoDraw);
    const start = $("range-start");
    if (start) {
      start.addEventListener("click", function () {
        const frameNo = currentFrameNo();
        if (frameNo === null) return;
        rangeStart = frameNo;
        if (rangeEnd !== null && rangeEnd < rangeStart) rangeEnd = null;
        updatePendingSummary();
        if (statusEl) {
          statusEl.textContent = "起点已设为帧 " + frameNo +
            (rangeEnd === null ? "，再切到结束帧点「设为终点」。" : "。");
        }
      });
    }
    const end = $("range-end");
    if (end) {
      end.addEventListener("click", function () {
        const frameNo = currentFrameNo();
        if (frameNo === null) return;
        if (rangeStart === null) {
          if (statusEl) statusEl.textContent = "先点「设为起点」，再设置终点。";
          return;
        }
        rangeEnd = frameNo;
        if (rangeEnd < rangeStart) {
          const swap = rangeStart;
          rangeStart = rangeEnd;
          rangeEnd = swap;
        }
        updatePendingSummary();
        if (statusEl) statusEl.textContent = "范围已设为帧 " + rangeStart + "–" + rangeEnd + "。";
      });
    }
    const clearRange = $("range-clear");
    if (clearRange) {
      clearRange.addEventListener("click", function () {
        rangeStart = null;
        rangeEnd = null;
        updatePendingSummary();
        if (statusEl) statusEl.textContent = "范围已清除，回到单帧。";
      });
    }
    if (textInput) textInput.addEventListener("input", updateSaveState);
  }

  document.addEventListener("keydown", function (event) {
    if (liveMode || wbVisible || !drawBoard) return;
    const tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") return;
    const active = drawBoard.getActiveObject();
    if (active && active.isEditing) return;
    const key = event.key.toLowerCase();
    if ((event.ctrlKey || event.metaKey) && key === "z") {
      event.preventDefault();
      if (event.shiftKey) redoDraw();
      else undoDraw();
      return;
    }
    if ((event.ctrlKey || event.metaKey) && key === "y") {
      event.preventDefault();
      redoDraw();
      return;
    }
    if (event.key === "Delete" || event.key === "Backspace") {
      if (drawBoard.getActiveObjects().length) {
        event.preventDefault();
        deleteSelectedDraw();
      }
    }
  });


  function initWhiteboard() {
    if (wbBoard || typeof fabric === "undefined") return;
    wbBoard = new fabric.Canvas("wb-canvas", {
      selection: false,
      preserveObjectStacking: true,
      backgroundColor: "#ffffff"
    });
    wbBoard.isDrawingMode = true;
    wbBoard.freeDrawingBrush = new fabric.PencilBrush(wbBoard);
    wbBoard.freeDrawingBrush.color = wbColor;
    const sizeInput = $("wb-size");
    wbBoard.freeDrawingBrush.width = sizeInput ? Number(sizeInput.value) || 4 : 4;
    wbBoard.on("path:created", function (event) {
      const path = event.path;
      path.annotationKind = "wb-stroke";
      path.selectable = false;
      path.evented = false;
      path.strokeUniform = true;
      recordWbAdd(path);
      markWbDirty();
    });
    wbBoard.on("mouse:down", onWbDown);
    wbBoard.on("mouse:move", onWbMove);
    wbBoard.on("mouse:up", onWbUp);
    wbBoard.on("object:added", markWbDirty);
    wbBoard.on("object:removed", markWbDirty);
    wbBoard.on("object:modified", markWbDirty);
  }

  function onWbDown(opt) {
    if (!wbVisible || opt.target || wbTool === "paint") return;
    const point = wbBoard.getPointer(opt.e);
    if (SHAPE_TOOLS[wbTool]) {
      const obj = makeShape(wbTool, point, point, wbColor);
      obj.highlight = wbTool === "highlight";
      obj.selectable = false;
      obj.evented = false;
      obj.lockRotation = true;
      obj.hasControls = false;
      wbShape = { kind: wbTool, start: point, last: point, obj: obj };
      wbBoard.add(obj);
      wbBoard.requestRenderAll();
      return;
    }
    if (wbTool !== "text") return;
    const fontSize = Number(($("wb-font-size") || {}).value) || 20;
    const text = new fabric.IText("说明", {
      left: point.x,
      top: point.y,
      fontSize: fontSize,
      fill: wbColor,
      fontFamily: '"Microsoft YaHei", sans-serif',
      padding: 4
    });
    text.selectable = true;
    text.evented = true;
    text.editable = true;
    wbBoard.add(text);
    recordWbAdd(text);
    wbBoard.setActiveObject(text);
    text.enterEditing();
    text.selectAll();
    text.on("editing:exited", function () {
      text.selectable = false;
      text.evented = false;
      text.editable = false;
      if (!text.text.trim()) wbBoard.remove(text);
      markWbDirty();
    });
  }

  function onWbMove(opt) {
    if (!wbShape) return;
    const point = wbBoard.getPointer(opt.e);
    const shape = wbShape;
    shape.last = point;
    if (shape.kind === "line" || shape.kind === "arrow") {
      const index = wbBoard.getObjects().indexOf(shape.obj);
      wbBoard.remove(shape.obj);
      const next = makeShape(shape.kind, shape.start, point, wbColor);
      next.selectable = false;
      next.evented = false;
      next.lockRotation = true;
      next.hasControls = false;
      wbBoard.add(next);
      if (index >= 0 && index < wbBoard.getObjects().length) {
        wbBoard.moveTo(next, index);
      }
      shape.obj = next;
      wbBoard.requestRenderAll();
      return;
    }
    const left = Math.min(shape.start.x, point.x);
    const top = Math.min(shape.start.y, point.y);
    const width = Math.abs(point.x - shape.start.x);
    const height = Math.abs(point.y - shape.start.y);
    if (shape.kind === "ellipse") {
      shape.obj.set({ left: left, top: top, rx: width / 2, ry: height / 2 });
    } else {
      shape.obj.set({ left: left, top: top, width: width, height: height });
    }
    shape.obj.setCoords();
    wbBoard.requestRenderAll();
  }

  function onWbUp() {
    if (!wbShape) return;
    const shape = wbShape;
    wbShape = null;
    const tiny = (shape.kind === "line" || shape.kind === "arrow")
      ? Math.hypot(shape.last.x - shape.start.x, shape.last.y - shape.start.y) < 8
      : ((shape.obj.width || 0) < 6 && (shape.obj.height || 0) < 6);
    if (tiny) {
      wbBoard.remove(shape.obj);
      wbBoard.requestRenderAll();
      return;
    }
    recordWbAdd(shape.obj);
    wbBoard.requestRenderAll();
    markWbDirty();
  }

  function setWbTool(key) {
    wbTool = key;
    wbShape = null;
    const tools = $("wb-tools");
    if (tools) {
      tools.querySelectorAll("button[data-wb-tool]").forEach(function (button) {
        button.classList.toggle("on", button.dataset.wbTool === key);
      });
    }
    if (!wbBoard) return;
    wbBoard.isDrawingMode = key === "paint";
    wbBoard.defaultCursor = key === "text" ? "text" : (SHAPE_TOOLS[key] ? "crosshair" : "default");
    const active = wbBoard.getActiveObject();
    if (active && active.isEditing) active.exitEditing();
    wbBoard.discardActiveObject();
    wbBoard.getObjects().forEach(function (obj) {
      const isText = obj.type === "i-text" || obj.type === "textbox";
      const canEdit = isText && key === "text";
      obj.selectable = canEdit;
      obj.evented = canEdit;
      obj.editable = canEdit;
    });
    wbBoard.requestRenderAll();
  }

  function setWbColor(color) {
    wbColor = color;
    const palette = $("wb-colors");
    if (palette) {
      palette.querySelectorAll("button[data-wb-color]").forEach(function (button) {
        button.classList.toggle("on", button.dataset.wbColor === color);
      });
    }
    if (wbBoard && wbBoard.freeDrawingBrush) {
      wbBoard.freeDrawingBrush.color = color;
    }
  }

  function recordWbAdd(obj) {
    wbHistory.push({ op: "add", obj: obj });
    wbRedo = [];
  }

  function undoWb() {
    const action = wbHistory.pop();
    if (!action) return;
    if (action.op === "add") {
      if (wbBoard.contains(action.obj)) wbBoard.remove(action.obj);
    } else if (action.op === "remove") {
      wbBoard.add(action.obj);
    } else if (action.op === "clear") {
      action.objs.forEach(function (obj) { wbBoard.add(obj); });
    }
    wbRedo.push(action);
    wbBoard.requestRenderAll();
    markWbDirty();
  }

  function redoWb() {
    const action = wbRedo.pop();
    if (!action) return;
    if (action.op === "add") {
      wbBoard.add(action.obj);
    } else if (action.op === "remove") {
      if (wbBoard.contains(action.obj)) wbBoard.remove(action.obj);
    } else if (action.op === "clear") {
      action.objs.forEach(function (obj) {
        if (wbBoard.contains(obj)) wbBoard.remove(obj);
      });
    }
    wbHistory.push(action);
    wbBoard.requestRenderAll();
    markWbDirty();
  }

  function clearWb() {
    if (!wbBoard) return;
    const objects = wbBoard.getObjects().slice();
    if (!objects.length) return;
    if (!window.confirm("清空白板？")) return;
    wbBoard.remove.apply(wbBoard, objects);
    wbHistory = [];
    wbRedo = [];
    markWbDirty();
  }

  function currentRange() {
    if (rangeStart === null) return null;
    const end = rangeEnd === null ? currentFrameNo() : rangeEnd;
    if (end === null) return null;
    return { start: Math.min(rangeStart, end), end: Math.max(rangeStart, end) };
  }

  function wbScopeValue(scope) {
    if (scope === "global") return { kind: "global" };
    if (scope === "range") {
      const range = currentRange();
      return range ? {
        kind: "range", frame_start: range.start, frame_end: range.end
      } : null;
    }
    const frameNo = currentFrameNo();
    return frameNo === null ? null : { kind: "frame", frame_no: frameNo };
  }

  function scopeKey(scope) {
    if (!scope) return "";
    if (scope.kind === "global") return "global";
    if (scope.kind === "frame") return "frame:" + scope.frame_no;
    return "range:" + scope.frame_start + "-" + scope.frame_end;
  }

  function scopeText(scope) {
    if (!scope) return "";
    if (scope.kind === "global") return "全局";
    if (scope.kind === "frame") return "帧 " + scope.frame_no;
    return "范围 " + scope.frame_start + "–" + scope.frame_end;
  }

  function findWbItem(scope) {
    const key = scopeKey(scope);
    for (const item of Object.values(wbItems)) {
      if (scopeKey(item.scope) === key) return item;
    }
    return null;
  }

  function updateWbScopeUI() {
    document.querySelectorAll("#wb-scope-btns button").forEach(function (button) {
      button.classList.toggle("on", button.dataset.wbScope === wbScope);
    });
    const rangeButton = document.querySelector('#wb-scope-btns button[data-wb-scope="range"]');
    if (rangeButton) rangeButton.disabled = !currentRange();
    const label = $("wb-scope-label");
    if (label) label.textContent = scopeText(wbScopeValue(wbScope));
  }

  function updateWbUi(item) {
    const text = $("wb-text");
    if (text) text.value = item ? item.text || "" : "";
    wbDirty = false;
    const status = $("wb-status");
    if (status) {
      status.textContent = item
        ? "已保存。"
        : "新白板：画出示意图，并写一句话。";
    }
    updateWbScopeUI();
  }

  function markWbDirty() {
    if (wbLoading || !wbVisible) return;
    wbDirty = true;
    const status = $("wb-status");
    if (status) status.textContent = "有修改，保存后生效。";
  }

  function loadWbItem(item) {
    if (!wbBoard) return;
    wbLoading = true;
    wbBoard.clear();
    wbBoard.backgroundColor = "#ffffff";
    wbCurrentId = item ? item.id : null;
    const apply = function () {
      wbLoading = false;
      wbBoard.requestRenderAll();
      updateWbUi(item);
    };
    if (item && item.objects) {
      wbBoard.loadFromJSON(item.objects, apply);
    } else {
      apply();
    }
  }

  async function openWhiteboard(scope, itemId) {
    if (!MODEL.whiteboardsUrl || !sessionId || liveMode) {
      const status = $("wb-status");
      if (status) status.textContent = "回放会话才能使用白板。";
      return;
    }
    initWhiteboard();
    if (!wbBoard) {
      const status = $("wb-status");
      if (status) status.textContent = "白板脚本未加载，请刷新页面或重启检视台。";
      return;
    }
    const nextScope = scope || "frame";
    if (!wbScopeValue(nextScope)) {
      const status = $("wb-status");
      if (status) status.textContent = "先设一个帧范围，再使用这一段白板。";
      return;
    }
    if (wbVisible && wbDirty) {
      await saveWb(true);
    }
    wbScope = nextScope;
    const overlay = $("whiteboard");
    if (overlay) overlay.hidden = false;
    wbVisible = true;
    updateWbScopeUI();
    const item = itemId ? wbItems[itemId] : findWbItem(wbScopeValue(wbScope));
    loadWbItem(item);
    wbBoard.calcOffset();
    wbBoard.requestRenderAll();
  }

  function closeWhiteboard(force) {
    if (!force && wbDirty && wbBoard && wbBoard.getObjects().length) {
      if (!window.confirm("白板有未保存修改，关闭会丢弃，继续吗？")) return;
    }
    const overlay = $("whiteboard");
    if (overlay) overlay.hidden = true;
    wbVisible = false;
    wbDirty = false;
  }

  async function saveWb(silent) {
    if (!wbBoard || !MODEL.whiteboardsUrl || !sessionId) return false;
    const scope = wbScopeValue(wbScope);
    const status = $("wb-status");
    if (!scope) {
      if (status && !silent) status.textContent = "先设一个帧范围。";
      return false;
    }
    const text = ($("wb-text") || {}).value || "";
    const labels = wbBoard.getObjects().filter(function (obj) {
      return obj.type === "i-text" || obj.type === "textbox";
    }).map(function (obj) { return (obj.text || "").trim(); }).filter(Boolean);
    if (!text.trim() && !labels.length) {
      if (status && !silent) {
        status.textContent = "请写一句话（或画布上写字），AI 主要读文字。";
      }
      return false;
    }
    wbBoard.discardActiveObject();
    wbBoard.requestRenderAll();
    const payload = {
      scope: scope,
      text: text,
      labels: labels,
      objects: wbBoard.toJSON(),
      image: wbBoard.toDataURL({ format: "png", multiplier: 1 }),
      confirmed: true
    };
    if (wbCurrentId) payload.id = wbCurrentId;
    if (status && !silent) status.textContent = "保存中…";
    try {
      const response = await fetch(MODEL.whiteboardsUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      if (!response.ok) {
        const message = data && data.error ? data.error.message : "HTTP " + response.status;
        if (status) status.textContent = "保存未完成：" + message;
        return false;
      }
      const item = data.whiteboard;
      wbItems[item.id] = item;
      wbCurrentId = item.id;
      wbDirty = false;
      updateWbUi(item);
      renderWbRefs();
      if (status) status.textContent = "已保存。";
      return true;
    } catch (error) {
      if (status) status.textContent = "保存未完成：" + String(error);
      return false;
    }
  }

  async function loadWhiteboards() {
    if (!MODEL.whiteboardsUrl || !sessionId) return;
    try {
      const response = await fetch(MODEL.whiteboardsUrl, { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      const document_ = data.whiteboards || {};
      wbItems = {};
      for (const item of document_.whiteboards || []) {
        if (item && item.id) wbItems[item.id] = item;
      }
      renderWbRefs();
    } catch (error) {
    }
  }

  function wbImageUrl(item) {
    const image = String(item.image || "");
    const filename = image.split("/").pop();
    if (!filename) return "";
    return "/whiteboards/" + encodeURIComponent(sessionId) + "/" + encodeURIComponent(filename);
  }

  function renderWbRefs() {
    const list = $("wb-ref-list");
    if (!list) return;
    const frameNo = currentFrameNo();
    const range = currentRange();
    function refRank(item) {
      const scope = item.scope || {};
      if (scope.kind === "frame" && scope.frame_no === frameNo) return 0;
      if (scope.kind === "range" && range &&
          scope.frame_start === range.start && scope.frame_end === range.end) {
        return 1;
      }
      if (scope.kind === "global") return 2;
      if (scope.kind === "frame") return 3;
      return 4;
    }
    const entries = Object.values(wbItems).sort(function (a, b) {
      return refRank(a) - refRank(b);
    });
    list.textContent = "";
    if (!entries.length) {
      const empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "还没有白板说明。";
      list.appendChild(empty);
      return;
    }
    entries.forEach(function (item) {
      const row = document.createElement("div");
      row.className = "wb-ref";
      row.addEventListener("click", function () {
        openWhiteboard(item.scope.kind, item.id);
      });
      const image = document.createElement("img");
      image.src = wbImageUrl(item);
      image.alt = "";
      image.loading = "lazy";
      image.onerror = function () { image.style.visibility = "hidden"; };
      row.appendChild(image);
      const meta = document.createElement("span");
      const title = document.createElement("span");
      title.className = "wb-ref-title";
      title.textContent = scopeText(item.scope) + " 白板";
      const line = document.createElement("span");
      line.className = "wb-ref-meta";
      const objectCount = item.objects && Array.isArray(item.objects.objects)
        ? item.objects.objects.length
        : 0;
      const state = document.createElement("span");
      state.className = "confirmed";
      state.textContent = "已保存";
      line.appendChild(state);
      line.appendChild(document.createTextNode(" · " + objectCount + " 个对象"));
      meta.appendChild(title);
      meta.appendChild(line);
      row.appendChild(meta);
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "wb-ref-delete";
      remove.textContent = "×";
      remove.title = "删除白板";
      remove.addEventListener("click", async function (event) {
        event.stopPropagation();
        if (!window.confirm("删除这个白板？")) return;
        try {
          const response = await fetch(
            MODEL.whiteboardsUrl + "/" + encodeURIComponent(item.id),
            { method: "DELETE" }
          );
          const data = await response.json().catch(function () { return null; });
          if (!response.ok) {
            const message = data && data.error ? data.error.message : "HTTP " + response.status;
            const status = $("wb-status");
            if (status) status.textContent = "删除未完成：" + message;
            return;
          }
          delete wbItems[item.id];
          if (wbCurrentId === item.id) {
            wbCurrentId = null;
            closeWhiteboard(true);
          }
          renderWbRefs();
        } catch (error) {
          const status = $("wb-status");
          if (status) status.textContent = "删除未完成：" + String(error);
        }
      });
      row.appendChild(remove);
      list.appendChild(row);
    });
  }

  function bindWhiteboard() {
    const tools = $("wb-tools");
    if (tools) {
      tools.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-wb-tool]");
        if (button) setWbTool(button.dataset.wbTool);
      });
    }
    const colors = $("wb-colors");
    if (colors) {
      colors.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-wb-color]");
        if (button) setWbColor(button.dataset.wbColor);
      });
    }
    const scopes = $("wb-scope-btns");

  function abortLiveStream() {
    liveStreamToken += 1;

  function resetLiveView() {
    abortLiveStream();
