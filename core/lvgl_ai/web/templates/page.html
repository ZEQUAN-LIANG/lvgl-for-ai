<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LVGL 检视台</title>
<style>
:root {
  color-scheme: dark;
  --bg: #1b1b1b;
  --panel: #232323;
  --panel-2: #282828;
  --panel-3: #303030;
  --line: #383838;
  --line-strong: #4a4a4a;
  --text: #e4e4e4;
  --muted: #a0a0a0;
  --dim: #737373;
  --accent: #4d9de0;
  --accent-wash: rgba(77, 157, 224, .12);
  --record: #e5484d;
  --test: #3fb950;
  --amber: #e8a33d;
  --red: #e5484d;
  --blue: #4d9de0;
  --font-ui: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "Microsoft YaHei UI", monospace;
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) transparent; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #1b1b1b; }
::-webkit-scrollbar-thumb { background: #464646; border: 2px solid #1b1b1b; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
[hidden] { display: none !important; }

/* ---- top toolbar ---- */
.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 1rem;
  height: 52px;
  padding: 0 14px;
  background: #202020;
  border-bottom: 1px solid #000;
  box-shadow: 0 1px 0 var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; flex: none; }
.brand-mark {
  position: relative;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: var(--accent);
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 2px solid #fff;
  border-radius: 2px;
  opacity: .9;
}
.brand-name { font-size: 14px; font-weight: 600; white-space: nowrap; }
.session-picker { display: flex; align-items: center; gap: .45rem; flex: 1; min-width: 0; max-width: 34rem; }
.session-picker label, .app-picker label { font-size: 12px; color: var(--muted); flex: none; }
.session-picker select, .app-picker select {
  min-width: 0;
  width: 100%;
  height: 30px;
  padding: 0 2rem 0 .6rem;
  appearance: none;
  -webkit-appearance: none;
  background:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%) calc(100% - 14px) 13px / 5px 5px no-repeat,
    linear-gradient(135deg, var(--muted) 50%, transparent 50%) calc(100% - 9px) 13px / 5px 5px no-repeat,
    var(--panel-2);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
}
.session-picker select:hover, .app-picker select:hover { border-color: #5c5c5c; }
.session-picker select:focus-visible, .app-picker select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
.app-picker { display: flex; align-items: center; gap: .45rem; flex: none; }
.app-picker select { width: auto; min-width: 9rem; }
.record-controls {
  display: flex;
  align-items: center;
  gap: .7rem;
  margin-left: auto;
  flex: none;
}
.record-state { display: flex; align-items: center; gap: .4rem; font-size: 12px; color: var(--muted); white-space: nowrap; }
.record-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dim); }
.record-controls[data-live-state="running"] .record-state .record-dot { background: var(--record); box-shadow: 0 0 0 2px rgba(229, 72, 77, .2); }
.record-controls[data-live-test="1"][data-live-state="running"] .record-state .record-dot { background: var(--test); box-shadow: 0 0 0 2px rgba(63, 185, 80, .2); }
.record-controls[data-live-state="starting"] .record-state .record-dot { background: var(--amber); }
.mode-note { font-size: 11px; color: var(--dim); white-space: nowrap; }
.record-btn, .test-btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  height: 30px;
  padding: 0 .8rem;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}
.record-btn { border-color: #5a3a3b; }
.record-btn .record-dot { background: var(--record); }
.record-btn:hover:not(:disabled) { background: #3a2b2c; }
.test-btn { border-color: #2f5a3a; }
.test-btn .record-dot { background: var(--test); }
.test-btn:hover:not(:disabled) { background: #263a2b; }
.record-btn[data-active="1"], .test-btn[data-active="1"] { background: var(--panel-3); border-color: #5c5c5c; }
.record-btn:disabled, .test-btn:disabled { opacity: .45; }
.live-session-link { font-size: 12px; white-space: nowrap; }
.manage-btn {
  flex: none;
  height: 30px;
  padding: 0 .8rem;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  font-size: 12px;
  white-space: nowrap;
}
.manage-btn:hover:not(:disabled) { background: var(--panel-3); }

.notice {
  margin: 12px 16px 0;
  padding: 8px 12px;
  border: 1px solid rgba(229, 72, 77, .45);
  border-left: 3px solid var(--record);
  border-radius: 4px;
  background: rgba(229, 72, 77, .08);
  color: #ffb4b6;
  font-size: 12px;
}
.notice strong { color: #ff8a8d; }

/* ---- main layout ---- */
.shell { max-width: 1500px; margin: 0 auto; padding: 14px 16px 24px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .5rem 1.5rem;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}
.panel-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem .65rem; min-width: 0; }
.eyebrow {
  width: 100%;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--dim);
  text-transform: uppercase;
}
.panel-title h2 { font-size: 16px; letter-spacing: .02em; }
.session-tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.readout { display: flex; gap: 1.4rem; }
.readout-item { display: flex; flex-direction: column; gap: .1rem; min-width: 3.6rem; }
.readout-label { font-size: 11px; color: var(--dim); }
.readout-value { font-family: var(--font-mono); font-size: 16px; line-height: 1.2; font-variant-numeric: tabular-nums; color: var(--text); }

.viewer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 14px;
  padding: 14px;
  align-items: start;
}
.viewer-main { min-width: 0; }
.stage-shell { min-width: 0; }
.stage-bezel {
  display: flex;
  justify-content: center;
  padding: 8px;
  background: #101010;
  border: 1px solid #000;
  border-radius: 4px;
}
.stage {
  position: relative;
  display: inline-block;
  max-width: 100%;
  background: #000;
  overflow: hidden;
  border-radius: 2px;
  user-select: none;
  touch-action: none;
  cursor: crosshair;
}
.stage.is-empty {
  display: flex;
  width: 100%;
  min-height: 20rem;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.stage img,
.stage canvas { display: block; max-width: 100%; max-height: 66vh; width: auto; height: auto; }
.stage-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .4rem;
  padding: 2rem 1rem;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.stage-empty-mark { font-size: 26px; color: #555; line-height: 1; }
.stage-empty-sub { font-size: 12px; color: var(--dim); }
.overlay-layer { position: absolute; inset: 0; pointer-events: none; }
.selection-box {
  position: absolute;
  border: 1px dashed #f0b45a;
  background: rgba(240, 180, 90, .14);
}
.diff-box {
  position: absolute;
  border: 1px solid var(--red);
  background: rgba(229, 72, 77, .13);
}
.diff-box.reference {
  border-style: dashed;
  border-color: var(--blue);
  background: rgba(77, 157, 224, .12);
}
.stage-hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
}
.hud-frame { display: flex; align-items: baseline; gap: 5px; }
.hud-label { font-size: 11px; letter-spacing: .06em; color: var(--dim); }
.hud-number { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
.hud-sep, .hud-total { color: var(--dim); font-variant-numeric: tabular-nums; }
.hud-time { color: var(--muted); white-space: nowrap; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; }
.transport-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  flex: none;
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  transition: background .12s, border-color .12s;
}
.transport-btn:hover:not(:disabled) { background: var(--panel-3); border-color: #5c5c5c; }
.transport-range { display: flex; flex: 1 1 12rem; flex-direction: column; gap: 2px; min-width: 8rem; }
input[type="range"] {
  -webkit-appearance: none;
          appearance: none;
  width: 100%;
  height: 20px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  --fill: 0%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px;
  background: linear-gradient(90deg, var(--accent) 0 var(--fill), #4a4a4a var(--fill) 100%);
  border-radius: 2px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  margin-top: -4.5px;
  background: #e8e8e8;
  border: 0;
  border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
input[type="range"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
input[type="range"]::-moz-range-track { height: 3px; background: #4a4a4a; border-radius: 2px; }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--accent); border-radius: 2px; }
input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: #e8e8e8;
  border: 0;
  border-radius: 50%;
}
.ticks { display: flex; justify-content: space-between; padding: 0 6px; }
.ticks i { width: 1px; height: 3px; background: #4a4a4a; }
.transport-readout {
  padding-left: 10px;
  border-left: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  white-space: nowrap;
}
.transport-time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.muted { color: var(--muted); }
.hint { margin: .35rem 0; color: var(--muted); font-size: 12px; line-height: 1.5; }

/* ---- inspector ---- */
.viewer-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side-block {
  padding: 10px;
  background: #1f1f1f;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.side-head { display: flex; align-items: baseline; gap: .45rem; margin-bottom: 8px; }
.side-head .index { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.side-head h3 { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.side-note { margin-left: auto; font-size: 10px; color: var(--dim); }
.toggle { display: flex; align-items: flex-start; gap: .5rem; font-size: 12px; cursor: pointer; }
input[type="checkbox"] {
  -webkit-appearance: none;
          appearance: none;
  position: relative;
  flex: none;
  width: 14px;
  height: 14px;
  margin: .15rem 0 0;
  background: #1b1b1b;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  cursor: pointer;
}
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 3px;
  height: 7px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
input[type="checkbox"]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

.snapshots { display: flex; flex-direction: column; gap: 5px; }
.snapshot {
  display: grid;
  grid-template-columns: 64px auto minmax(0, 1fr);
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 4px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--text);
  text-align: left;
  transition: background .12s, border-color .12s;
}
.snapshot:hover { background: #262626; border-color: var(--line-strong); }
.snapshot.active { border-color: var(--accent); background: var(--accent-wash); }
.snapshot-thumb {
  display: block;
  width: 64px;
  height: 38px;
  overflow: hidden;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.snapshot-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; opacity: .8; }
.snapshot-num { font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.snapshot-label { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.snapshot.active .snapshot-num { color: var(--accent); }

#annotation-form {
  margin: 2px 0 8px;
  padding: 9px;
  background: #1b1b1b;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.field { display: block; margin: 7px 0; font-size: 11px; color: var(--muted); }
.field input, .field textarea {
  width: 100%;
  margin-top: 4px;
  padding: 6px 8px;
  background: #232323;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color .12s, box-shadow .12s;
}
.field input:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-wash);
}
.field textarea { min-height: 3.5rem; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.primary-btn {
  height: 30px;
  padding: 0 .9rem;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 4px;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
}
.primary-btn:hover:not(:disabled) { background: #5faae8; border-color: #5faae8; }
.primary-btn:disabled { opacity: .4; }
.ghost-btn {
  height: 30px;
  padding: 0 .8rem;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  color: var(--muted);
  font-size: 12px;
}
.ghost-btn:hover:not(:disabled) { color: var(--text); background: var(--panel-3); border-color: #5c5c5c; }
.pending { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  padding: 2px 7px;
  background: rgba(232, 163, 61, .12);
  border: 1px solid rgba(232, 163, 61, .4);
  border-radius: 3px;
  color: var(--amber);
  font-family: var(--font-mono);
  font-size: 10px;
}
.chip button { padding: 0 .15rem; background: transparent; border: 0; color: var(--amber); font-size: 13px; line-height: 1; }
.chip button:hover { color: #ffd08a; }
.notes { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
.notes li {
  padding: 7px 9px;
  background: #1b1b1b;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 12px;
  transition: border-color .12s, background .12s;
}
.notes li[data-note-frame] { cursor: pointer; }
.notes li[data-note-frame]:hover { border-color: var(--line-strong); background: #202020; }
.notes li.empty { color: var(--dim); font-size: 11px; cursor: default; }
.note-meta { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--dim); }
.tags { color: var(--amber); font-family: var(--font-mono); font-size: 10px; }
.notes p { margin: 4px 0 2px; }
.note-regions { display: block; margin-top: 3px; color: var(--dim); font-family: var(--font-mono); font-size: 10px; }
.note-crops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.note-crop {
  display: block;
  max-width: 100%;
  max-height: 160px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #111;
}

/* ---- timeline ---- */
.timeline-block { padding: 0 14px 14px; }
.table-wrap {
  overflow: auto;
  max-height: 24rem;
  background: #1b1b1b;
  border: 1px solid var(--line);
  border-radius: 4px;
}
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-family: var(--font-mono); font-size: 11px; }
#timeline th:nth-child(1), #timeline td:nth-child(1) { width: 6.5rem; }
#timeline th:nth-child(2), #timeline td:nth-child(2) { width: 4.5rem; }
#timeline th:nth-child(3), #timeline td:nth-child(3) { width: 5.5rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid #2c2c2c; text-align: left; white-space: nowrap; }
th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #242424;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
}
tbody tr { transition: background .1s; }
tbody tr:hover { background: #242424; }
tr.is-jump { cursor: pointer; }
tr.is-jump:hover td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.kind {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .03em;
  text-transform: uppercase;
}
.kind-frame { color: var(--accent); border-color: rgba(77, 157, 224, .35); }
.kind-input { color: #8fc7f0; border-color: rgba(143, 199, 240, .3); }
.kind-wait { color: var(--amber); border-color: rgba(232, 163, 61, .3); }
.kind-mark { color: var(--text); }
.kind-snapshot { color: #c9d9a8; border-color: rgba(201, 217, 168, .3); }
.kind-end { color: var(--red); border-color: rgba(229, 72, 77, .3); }

/* ---- live mode ---- */
#replay[data-has-frames="0"] .replay-only,
#replay[data-live-state="starting"] .replay-only,
#replay[data-live-state="running"] .replay-only { display: none !important; }
#replay[data-has-frames="0"] .annotation-block { display: none !important; }
/* Test/record mode is not an annotation state: keep the block visible so
 * the lock reason is explicit instead of the tools silently disappearing. */
#replay[data-live-state="starting"] #annotation-form,
#replay[data-live-state="starting"] #annotation-list,
#replay[data-live-state="running"] #annotation-form,
#replay[data-live-state="running"] #annotation-list { display: none !important; }
.annotation-locked { display: none; }
#replay[data-live-state="starting"] .annotation-locked,
#replay[data-live-state="running"] .annotation-locked { display: block; }
#replay[data-live-state="starting"] .stage,
#replay[data-live-state="running"] .stage { cursor: pointer; }
.live-note, .empty-note { display: none; }
#replay[data-live-state="starting"] .live-note,
#replay[data-live-state="running"] .live-note { display: block; }
#replay[data-has-frames="0"][data-live-state="stopped"] .empty-note { display: block; }

{{APP_MANAGER_STYLE}}

/* ---- footer ---- */
.colophon {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: .4rem 1.5rem;
  padding: 10px 2px 0;
  color: var(--dim);
  font-size: 11px;
}

/* Live and replay frames swap without animation; the viewer is evidence, not
 * decoration. Keep this section free of @keyframes. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

@media (max-width: 1080px) {
  .viewer { grid-template-columns: 1fr; }
  .viewer-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); align-items: start; }
}
@media (max-width: 820px) {
  .masthead { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: .5rem .8rem; }
  .session-picker { order: 3; width: 100%; max-width: none; flex-basis: 100%; }
  .app-picker { order: 2; }
  .manage-btn { order: 2; }
  .record-controls { margin-left: auto; }
  .manager-body { grid-template-columns: 1fr; max-height: calc(100vh - 120px); }
  .mode-note { display: none; }
  .panel-head { align-items: flex-start; }
  .readout { gap: 1rem; }
  .viewer-side { display: flex; }
  .stage img,
  .stage canvas { max-height: 56vh; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">LVGL 检视台</span>
  </div>
  <form method="get" action="/" class="session-picker">
    <label for="session-select">会话</label>
    <select id="session-select" name="session" onchange="this.form.submit()">{{SESSION_OPTIONS}}</select>
    <noscript><button type="submit" class="ghost-btn">打开</button></noscript>
  </form>
{{APP_PICKER}}
  <button id="app-manage" class="manage-btn" type="button" aria-haspopup="dialog" aria-controls="app-manager">应用管理</button>
  <div class="record-controls" id="record-controls" data-live-state="stopped">
    <span class="record-state"><span class="record-dot" aria-hidden="true"></span><span id="live-status">未启动</span></span>
    <span class="mode-note" id="mode-note">回放模式</span>
    <button id="live-record" class="record-btn" type="button" data-active="0"><span class="record-dot" aria-hidden="true"></span><span class="btn-label">录制</span></button>
    <button id="live-test" class="test-btn" type="button" data-active="0"><span class="record-dot" aria-hidden="true"></span><span class="btn-label">测试</span></button>
    <span id="live-session" class="live-session-link"></span>
  </div>
</header>
{{PAGE_ERROR}}
<main class="shell">
{{REPLAY}}
  <footer class="colophon">
    <span>LVGL 检视台</span>
    <span>帧、时间线与标注来自会话录制；判定由人给出。</span>
  </footer>
</main>
{{APP_MANAGER_HTML}}
<script>
const MODEL = {{MODEL_JSON}};
(function () {
  "use strict";

  // Injected from lvgl_ai/web/wire.py: one definition shared with the Python
  // encoder for the raw preview stream and the page heartbeat.
  const LIVE_WIRE = {{LIVE_WIRE_JSON}};

  const $ = function (id) { return document.getElementById(id); };

  function sessionUrl(id) {
    return "/?session=" + encodeURIComponent(id);
  }

  // Page tracking for the no-console launcher: the server exits when the last
  // tracked page closes. The heartbeat also covers a crashed tab; the close
  // beacon makes a normal tab close immediate.
  const PAGE_ID = (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : "page-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);

  function pageBeacon(path, useBeacon) {
    const body = JSON.stringify({ id: PAGE_ID });
    if (useBeacon && navigator.sendBeacon) {
      try {
        navigator.sendBeacon(path, new Blob([body], { type: "application/json" }));
        return;
      } catch (error) { /* fall through to fetch */ }
    }
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body,
      cache: "no-store",
      keepalive: true
    }).catch(function () { /* the server may already be gone */ });
  }

  let pageHeartbeat = null;
  function startPageHeartbeat() {
    if (pageHeartbeat) return;
    pageHeartbeat = setInterval(function () {
      pageBeacon("/api/page/open", false);
    }, LIVE_WIRE.heartbeatMs);
  }

  pageBeacon("/api/page/open", false);
  startPageHeartbeat();
  window.addEventListener("pagehide", function () {
    if (pageHeartbeat) {
      clearInterval(pageHeartbeat);
      pageHeartbeat = null;
    }
    pageBeacon("/api/page/close", true);
  });
  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      pageBeacon("/api/page/open", false);
      startPageHeartbeat();
    }
  });

  const sessionId = MODEL.sessionId;
  const frames = Array.isArray(MODEL.frames) ? MODEL.frames : [];
  const diffRows = MODEL.diffs || {};
  const refDiffRows = MODEL.refDiffs || {};
  let frameIndex = 0;
  let snapshotMode = null;
  let pendingRegions = [];
  let notesCount = MODEL.notesCount || 0;
  let liveMode = false;
  let liveTestMode = false;
  // Start/stop invalidates polls that were already in flight; a stale
  // running=true response must not redraw the live view after a stop.
  let liveRequestToken = 0;
  let liveSessionId = null;
  let previousLiveSessionId = null;
  let liveRunning = false;
  let liveStarting = false;
  let liveSwitching = false;
  // Raw preview state: the stream owns the canvas after the first frame;
  // /api/live only supplies running/session/buttons and the frame total.
  let liveHasFrame = false;
  let liveFrameNo = null;
  let liveFrameTMs = 0;
  let liveFrameCount = 0;
  let liveStreamAbort = null;
  let liveStreamToken = 0;
  let liveStreamRetry = null;
  let liveHudAt = 0;

  const img = $("frame-image");
  // Decode replay frames off-DOM and swap only when ready. Assigning a new
  // <img> src during rapid slider scrubbing briefly exposes the stage's black
  // background while the PNG loads; preloading removes that gap.
  const replayLoader = new Image();
  let replayLoadToken = 0;
  const stage = $("stage");
  const selection = $("selection-box");
  const diffLayer = $("diff-layer");
  const slider = $("frame-slider");
  const positionEl = $("frame-position");
  const timeEl = $("frame-time");
  const diffToggle = $("diff-toggle");
  const diffNote = $("diff-note");
  const snapshotBack = $("snapshot-back");
  const saveButton = $("annotation-save");
  const tagsInput = $("annotation-tags");
  const textInput = $("annotation-text");
  const statusEl = $("annotation-status");
  const pendingEl = $("pending-regions");
  const notesList = $("annotation-list");
  const annotationTotal = $("annotation-total");
  const frameTotal = $("frame-total");
  const hudLabel = $("hud-label");
  const hudFrameNo = $("hud-frame-no");
  const hudTotal = $("hud-frame-total");
  const hudTime = $("hud-time");
  const replayPanel = $("replay");
  const recordControls = $("record-controls");
  const modeNote = $("mode-note");
  const liveStatus = $("live-status");
  const liveSession = $("live-session");
  const liveApp = $("live-app");
  let lastLiveApp = liveApp ? liveApp.value : "";
{{APP_MANAGER_STATE_JS}}
  const liveCanvas = $("live-canvas");
  const liveCanvasCtx = liveCanvas ? liveCanvas.getContext("2d") : null;
  const stageEmpty = $("stage-empty");
  const stageEmptyText = $("stage-empty-text");
  const stageEmptySub = $("stage-empty-sub");

  function currentFrame() {
    return frames.length ? frames[frameIndex] : null;
  }

  function activeSurface() {
    if (!liveMode) return img;
    return liveHasFrame ? liveCanvas : null;
  }

  function activeFrame() {
    // Recording is read-only: annotations belong to a finished replay session.
    return liveMode ? null : currentFrame();
  }

  function padFrame(no) {
    const text = String(no);
    return text.length >= 4 ? text : ("0000" + text).slice(-4);
  }

  function setHud(label, no, total, time) {
    if (hudLabel) hudLabel.textContent = label;
    if (hudFrameNo) hudFrameNo.textContent = no;
    if (hudTotal) hudTotal.textContent = String(total);
    if (hudTime) hudTime.textContent = time;
  }

  function updateSliderFill() {
    if (!slider) return;
    const max = Number(slider.max) || 1;
    const value = Number(slider.value) || 1;
    const pct = max > 1 ? ((value - 1) / (max - 1)) * 100 : 100;
    slider.style.setProperty("--fill", pct + "%");
  }

  function updateSaveState() {
    if (!saveButton) return;
    const hasText = textInput ? textInput.value.trim().length > 0 : false;
    saveButton.disabled = liveMode || !activeFrame() || !MODEL.annotationsUrl ||
      snapshotMode !== null || (pendingRegions.length === 0 && !hasText);
  }

  function renderPending() {
    if (!pendingEl) return;
    pendingEl.textContent = "";
    pendingRegions.forEach(function (region, index) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.appendChild(document.createTextNode(
        region.x + ", " + region.y + " " + region.w + "×" + region.h + " "
      ));
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "移除框选";
      remove.addEventListener("click", function () {
        pendingRegions.splice(index, 1);
        renderPending();
        updateSaveState();
      });
      chip.appendChild(remove);
      pendingEl.appendChild(chip);
    });
    pendingEl.hidden = pendingRegions.length === 0;
    updateSaveState();
  }

  function renderDiff() {
    if (!diffLayer) return;
    diffLayer.textContent = "";
    const on = Boolean(diffToggle && diffToggle.checked) && !liveMode;
    diffLayer.hidden = !on;
    if (!on) {
      if (diffNote) diffNote.textContent = "diff 默认关闭。";
      return;
    }
    const frame = currentFrame();
    if (!frame || snapshotMode) {
      if (diffNote) diffNote.textContent = "当前不在帧视图，没有可覆盖的 diff。";
      return;
    }
    const row = diffRows[String(frame.frame_no)];
    const reference = refDiffRows[String(frame.frame_no)];
    if (!row && !reference) {
      if (diffNote) diffNote.textContent = "当前帧没有 diff 行（首帧不写 diff）。";
      return;
    }
    const parts = [];
    if (addDiffBox(diffLayer, row, "")) {
      parts.push("帧间 diff：changed_px=" + row.changed_px + "，max_delta=" + row.max_delta);
    }
    if (addDiffBox(diffLayer, reference, "reference")) {
      parts.push("参考图 diff：changed_px=" + reference.changed_px + "，max_delta=" + reference.max_delta);
    }
    if (diffNote) diffNote.textContent = parts.join("；") || "当前帧没有可覆盖的 bbox。";
  }

  function addDiffBox(layer, row, className) {
    if (!row || !row.bbox) return false;
    const width = row.width || (img && img.naturalWidth) || 0;
    const height = row.height || (img && img.naturalHeight) || 0;
    if (!width || !height) return false;
    const box = document.createElement("div");
    box.className = "diff-box" + (className ? " " + className : "");
    box.style.left = (row.bbox.x / width * 100) + "%";
    box.style.top = (row.bbox.y / height * 100) + "%";
    box.style.width = (row.bbox.w / width * 100) + "%";
    box.style.height = (row.bbox.h / height * 100) + "%";
    box.title = "changed_px=" + row.changed_px + ", max_delta=" + row.max_delta;
    layer.appendChild(box);
    return true;
  }

  function clearSnapshotActive() {
    document.querySelectorAll("button.snapshot.active").forEach(function (button) {
      button.classList.remove("active");
    });
  }

  function swapReplayImage(url) {
    if (!img) return;
    img.hidden = false;
    if (img.getAttribute("src") === url) return;
    const token = ++replayLoadToken;
    const apply = function () {
      if (token !== replayLoadToken) return;
      if (img.getAttribute("src") !== url) img.src = url;
    };
    replayLoader.onload = apply;
    replayLoader.onerror = apply;
    replayLoader.src = url;
    if (replayLoader.decode) {
      replayLoader.decode().then(apply).catch(function () {});
    }
  }

  function showFrame(index) {
    if (liveMode || !frames.length) return;
    frameIndex = Math.max(0, Math.min(frames.length - 1, index));
    snapshotMode = null;
    const frame = frames[frameIndex];
    if (img) {
      swapReplayImage(frame.url);
      img.alt = "第 " + frame.frame_no + " 帧";
      // The viewer swaps frames without any fade or flash. Keep it that way:
      // the range slider emits input events at pointer speed.
    }
    if (slider) slider.value = String(frameIndex + 1);
    updateSliderFill();
    if (positionEl) positionEl.textContent = (frameIndex + 1) + " / " + MODEL.frameCount;
    if (timeEl) timeEl.textContent = "t=" + (frame.t_ms || 0) + " ms";
    setHud("FRAME", padFrame(frame.frame_no), MODEL.frameCount, "t = " + (frame.t_ms || 0) + " ms");
    if (frameTotal) frameTotal.textContent = String(MODEL.frameCount);
    if (snapshotBack) snapshotBack.hidden = true;
    clearSnapshotActive();
    pendingRegions = [];
    renderPending();
    if (selection) selection.hidden = true;
    renderDiff();
    updateSaveState();
  }

  function showSnapshot(entry) {
    if (!img || liveMode) return;
    snapshotMode = entry;
    swapReplayImage(entry.url);
    img.alt = "关键画面 " + entry.label;
    if (positionEl) positionEl.textContent = "关键画面";
    if (timeEl) timeEl.textContent = entry.label;
    setHud("SNAPSHOT", "—", MODEL.frameCount, entry.label);
    if (snapshotBack) snapshotBack.hidden = false;
    document.querySelectorAll("button.snapshot").forEach(function (button) {
      button.classList.toggle(
        "active",
        button.getAttribute("data-snapshot-url") === entry.url
      );
    });
    pendingRegions = [];
    renderPending();
    if (selection) selection.hidden = true;
    renderDiff();
    updateSaveState();
  }

  if (frames.length) showFrame(0);
  updateSliderFill();

  if (slider) {
    let sliderRaf = 0;
    let sliderTarget = 0;
    slider.addEventListener("input", function () {
      // Coalesce pointer-speed input events into one frame per paint.
      sliderTarget = Number(slider.value) - 1;
      if (sliderRaf) return;
      sliderRaf = requestAnimationFrame(function () {
        sliderRaf = 0;
        showFrame(sliderTarget);
      });
    });
  }
  const previous = $("frame-prev");
  const next = $("frame-next");
  if (previous) previous.addEventListener("click", function () { showFrame(frameIndex - 1); });
  if (next) next.addEventListener("click", function () { showFrame(frameIndex + 1); });
  if (snapshotBack) snapshotBack.addEventListener("click", function () { showFrame(frameIndex); });

  document.querySelectorAll("button.snapshot").forEach(function (button) {
    button.addEventListener("click", function () {
      showSnapshot({
        url: button.getAttribute("data-snapshot-url"),
        label: button.getAttribute("data-snapshot-label")
      });
    });
  });

  if (diffToggle) diffToggle.addEventListener("change", renderDiff);

  function jumpToFrameNo(frameNo) {
    if (liveMode) return;
    const index = frames.findIndex(function (frame) { return frame.frame_no === frameNo; });
    if (index >= 0) showFrame(index);
  }

  document.querySelectorAll("#timeline tbody tr[data-frame-no]").forEach(function (row) {
    row.addEventListener("click", function () {
      jumpToFrameNo(Number(row.getAttribute("data-frame-no")));
    });
  });

  function bindNoteJump(item) {
    if (!item || !item.hasAttribute("data-note-frame")) return;
    item.addEventListener("click", function () {
      jumpToFrameNo(Number(item.getAttribute("data-note-frame")));
    });
  }

  if (notesList) {
    notesList.querySelectorAll("li[data-note-frame]").forEach(bindNoteJump);
  }

  document.addEventListener("keydown", function (event) {
    if (liveMode) return;
    const tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") return;
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      showFrame(frameIndex - 1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      showFrame(frameIndex + 1);
    }
  });

  let drag = null;
  let livePointer = null;
  let lastLiveMoveAt = 0;

  function sendLivePointer(action, x, y) {
    if (!liveSessionId) return;
    return liveCall("POST", "/api/live/pointer", {
      action: action,
      x: Math.round(x),
      y: Math.round(y)
    });
  }

  function sendLiveKey(action, key) {
    if (!liveSessionId) return;
    return liveCall("POST", "/api/live/key", { action: action, key: key });
  }

  function lvglKeyFor(event) {
    switch (event.key) {
      case "ArrowUp": return "UP";
      case "ArrowDown": return "DOWN";
      case "ArrowLeft": return "LEFT";
      case "ArrowRight": return "RIGHT";
      case "Escape": return "ESC";
      case "Enter": return "ENTER";
      case "Tab": return event.shiftKey ? "PREV" : "NEXT";
      case "Backspace": return "BACKSPACE";
      case "Delete": return "DEL";
      case "Home": return "HOME";
      case "End": return "END";
      default: return null;
    }
  }

  function stagePoint(event) {
    const surface = activeSurface();
    if (!surface || surface.hidden) return null;
    const rect = surface.getBoundingClientRect();
    const width = surface === liveCanvas
      ? liveCanvas.width
      : (surface.naturalWidth || rect.width);
    const height = surface === liveCanvas
      ? liveCanvas.height
      : (surface.naturalHeight || rect.height);
    if (!rect.width || !rect.height || !width || !height) return null;
    const x = (event.clientX - rect.left) / rect.width * width;
    const y = (event.clientY - rect.top) / rect.height * height;
    if (x < 0 || y < 0 || x > width || y > height) return null;
    return { x: x, y: y, width: width, height: height };
  }

  function drawSelection(start, end) {
    if (!selection || !drag) return;
    const x = Math.min(start.x, end.x);
    const y = Math.min(start.y, end.y);
    const w = Math.abs(end.x - start.x);
    const h = Math.abs(end.y - start.y);
    selection.style.left = (x / drag.width * 100) + "%";
    selection.style.top = (y / drag.height * 100) + "%";
    selection.style.width = (w / drag.width * 100) + "%";
    selection.style.height = (h / drag.height * 100) + "%";
    selection.hidden = false;
  }

  if (stage) {
    stage.addEventListener("pointerdown", function (event) {
      if (liveMode) {
        if (!liveSessionId) return;
        if (typeof event.button === "number" && event.button !== 0) return;
        const point = stagePoint(event);
        if (!point) return;
        if (stage.focus) stage.focus();
        livePointer = { x: point.x, y: point.y };
        sendLivePointer("down", point.x, point.y);
        if (stage.setPointerCapture) {
          try { stage.setPointerCapture(event.pointerId); } catch (error) { /* ignore */ }
        }
        event.preventDefault();
        return;
      }
      if (!activeFrame() || snapshotMode) return;
      if (typeof event.button === "number" && event.button !== 0) return;
      const point = stagePoint(event);
      if (!point) return;
      drag = { start: point, width: point.width, height: point.height };
      drawSelection(point, point);
      if (stage.setPointerCapture) {
        try { stage.setPointerCapture(event.pointerId); } catch (error) { /* ignore */ }
      }
      event.preventDefault();
    });
    stage.addEventListener("pointermove", function (event) {
      if (liveMode) {
        if (!livePointer) return;
        const point = stagePoint(event);
        if (!point) return;
        livePointer = { x: point.x, y: point.y };
        const now = performance.now();
        if (now - lastLiveMoveAt >= 40) {
          lastLiveMoveAt = now;
          sendLivePointer("move", point.x, point.y);
        }
        event.preventDefault();
        return;
      }
      if (!drag) return;
      const point = stagePoint(event);
      if (!point) return;
      drawSelection(drag.start, point);
      event.preventDefault();
    });
    stage.addEventListener("pointerup", function (event) {
      if (liveMode) {
        if (!livePointer) return;
        const point = stagePoint(event) || livePointer;
        livePointer = null;
        sendLivePointer("up", point.x, point.y);
        event.preventDefault();
        return;
      }
      if (!drag) return;
      const point = stagePoint(event) || drag.start;
      const x = Math.min(drag.start.x, point.x);
      const y = Math.min(drag.start.y, point.y);
      const w = Math.abs(point.x - drag.start.x);
      const h = Math.abs(point.y - drag.start.y);
      drag = null;
      if (selection) selection.hidden = true;
      if (w >= 2 && h >= 2) {
        pendingRegions.push({
          x: Math.max(0, Math.round(x)),
          y: Math.max(0, Math.round(y)),
          w: Math.max(1, Math.round(w)),
          h: Math.max(1, Math.round(h))
        });
        renderPending();
      }
      updateSaveState();
    });
    stage.addEventListener("pointercancel", function () {
      if (liveMode) {
        if (livePointer) {
          sendLivePointer("up", livePointer.x, livePointer.y);
          livePointer = null;
        }
        return;
      }
      drag = null;
      if (selection) selection.hidden = true;
    });
    stage.addEventListener("keydown", function (event) {
      if (!liveMode) return;
      const key = lvglKeyFor(event);
      if (!key) return;
      event.preventDefault();
      if (event.repeat) return;
      sendLiveKey("press", key);
    });
    stage.addEventListener("keyup", function (event) {
      if (!liveMode) return;
      const key = lvglKeyFor(event);
      if (!key) return;
      event.preventDefault();
      sendLiveKey("release", key);
    });
  }

  if (tagsInput) tagsInput.addEventListener("input", updateSaveState);
  if (textInput) textInput.addEventListener("input", updateSaveState);

  const clearButton = $("annotation-clear");
  if (clearButton) {
    clearButton.addEventListener("click", function () {
      pendingRegions = [];
      renderPending();
      if (selection) selection.hidden = true;
      updateSaveState();
    });
  }

  // Notes have one renderer: page_render._render_notes, which also owns the
  // /regions/<session>/<file> crop links. After a save this list is replaced
  // with that server-rendered markup instead of rebuilding note fields here.
  async function refreshNotes() {
    if (!notesList || !sessionId) return false;
    try {
      const response = await fetch(sessionUrl(sessionId), {
        headers: { "Accept": "text/html" },
        cache: "no-store"
      });
      if (!response.ok) return false;
      const parsed = new DOMParser().parseFromString(
        await response.text(), "text/html"
      );
      const replayPanel = parsed.getElementById("replay");
      if (!replayPanel || replayPanel.getAttribute("data-session-id") !== sessionId) {
        return false;
      }
      const fresh = parsed.getElementById("annotation-list");
      if (!fresh) return false;
      notesList.innerHTML = fresh.innerHTML;
      notesList.querySelectorAll("li[data-note-frame]").forEach(bindNoteJump);
      return true;
    } catch (error) {
      return false;
    }
  }

  if (saveButton) {
    saveButton.addEventListener("click", async function () {
      const frame = activeFrame();
      const endpoint = MODEL.annotationsUrl;
      if (!frame || !endpoint || snapshotMode) return;
      const tags = (tagsInput ? tagsInput.value : "").split(",")
        .map(function (tag) { return tag.trim(); })
        .filter(function (tag) { return tag.length > 0; });
      const payload = {
        frame_no: frame.frame_no,
        t_ms: frame.t_ms || 0,
        regions: pendingRegions.slice(),
        tags: tags,
        text: textInput ? textInput.value : ""
      };
      saveButton.disabled = true;
      if (statusEl) statusEl.textContent = "保存中…";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          const message = data && data.error ? data.error.message : "HTTP " + response.status;
          if (statusEl) statusEl.textContent = "保存未完成：" + message;
          updateSaveState();
          return;
        }
        pendingRegions = [];
        renderPending();
        if (tagsInput) tagsInput.value = "";
        if (textInput) textInput.value = "";
        if (statusEl) statusEl.textContent = "已保存标注 " + data.note.id + "。";
        await refreshNotes();
        notesCount += 1;
        if (annotationTotal) annotationTotal.textContent = String(notesCount);
      } catch (error) {
        if (statusEl) statusEl.textContent = "保存未完成：" + String(error);
      }
      updateSaveState();
    });
  }

  updateSaveState();

  async function liveCall(method, path, body) {
    try {
      const options = { method: method, cache: "no-store" };
      if (body !== undefined) {
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(body);
      }
      const response = await fetch(path, options);
      let data = null;
      try { data = await response.json(); } catch (error) { data = null; }
      return { ok: response.ok, status: response.status, data: data };
    } catch (error) {
      return { ok: false, status: 0, data: null };
    }
  }

{{APP_MANAGER_ACTIONS_JS}}

  function abortLiveStream() {
    liveStreamToken += 1;
    if (liveStreamRetry) {
      clearTimeout(liveStreamRetry);
      liveStreamRetry = null;
    }
    if (liveStreamAbort) {
      const controller = liveStreamAbort;
      liveStreamAbort = null;
      try { controller.abort(); } catch (error) { /* ignore */ }
    }
  }

  function resetLiveView() {
    abortLiveStream();
    liveHasFrame = false;
    liveFrameNo = null;
    liveFrameTMs = 0;
    liveFrameCount = 0;
    liveHudAt = 0;
    if (liveCanvas) {
      liveCanvas.hidden = true;
      if (liveCanvasCtx) {
        liveCanvasCtx.clearRect(0, 0, liveCanvas.width, liveCanvas.height);
      }
    }
  }

  function scheduleLiveStreamRetry(token) {
    if (liveStreamRetry) return;
    liveStreamRetry = setTimeout(function () {
      liveStreamRetry = null;
      if (token === liveStreamToken && liveRunning) {
        startLiveStream();
      }
    }, 500);
  }

  function handleLiveFrame(width, height, frameNo, tMs, pixels) {
    if (!liveCanvas || !liveCanvasCtx) return;
    if (liveCanvas.width !== width || liveCanvas.height !== height) {
      liveCanvas.width = width;
      liveCanvas.height = height;
    }
    const rgba = new Uint8ClampedArray(
      pixels.buffer, pixels.byteOffset, pixels.byteLength
    );
    liveCanvasCtx.putImageData(new ImageData(rgba, width, height), 0, 0);
    if (!liveHasFrame) {
      liveHasFrame = true;
      liveCanvas.hidden = false;
      if (img) img.hidden = true;
      if (stage) stage.classList.remove("is-empty");
      if (stageEmpty) stageEmpty.hidden = true;
    }
    liveFrameNo = frameNo;
    liveFrameTMs = tMs;
    const now = performance.now();
    if (now - liveHudAt >= 250) {
      liveHudAt = now;
      const total = Math.max(liveFrameCount, frameNo);
      setHud("LIVE", padFrame(frameNo), total, "t = " + tMs + " ms");
      if (frameTotal) frameTotal.textContent = String(total);
    }
  }

  function createLiveParser(onFrame) {
    const HEADER = LIVE_WIRE.headerSize;
    const header = new Uint8Array(HEADER);
    let headerFill = 0;
    let meta = null;
    let payload = null;
    let payloadFill = 0;
    return function feed(chunk) {
      let offset = 0;
      while (offset < chunk.length) {
        if (headerFill < HEADER) {
          const take = Math.min(HEADER - headerFill, chunk.length - offset);
          header.set(chunk.subarray(offset, offset + take), headerFill);
          headerFill += take;
          offset += take;
          if (headerFill < HEADER) continue;
          if (String.fromCharCode(header[0], header[1], header[2], header[3]) !== LIVE_WIRE.magic) {
            throw new Error("invalid live stream frame");
          }
          const view = new DataView(header.buffer);
          const width = view.getUint32(LIVE_WIRE.headerFields.width, true);
          const height = view.getUint32(LIVE_WIRE.headerFields.height, true);
          const frameNo = view.getUint32(LIVE_WIRE.headerFields.frameNo, true);
          const tMs = view.getUint32(LIVE_WIRE.headerFields.tMs, true);
          const size = width * height * LIVE_WIRE.pixelStride;
          if (!width || !height || size > LIVE_WIRE.maxFrameBytes) {
            throw new Error("invalid live stream dimensions");
          }
          meta = { width: width, height: height, frameNo: frameNo, tMs: tMs };
          payload = new Uint8Array(size);
          payloadFill = 0;
        } else {
          const take = Math.min(payload.length - payloadFill, chunk.length - offset);
          payload.set(chunk.subarray(offset, offset + take), payloadFill);
          payloadFill += take;
          offset += take;
          if (payloadFill === payload.length) {
            onFrame(meta.width, meta.height, meta.frameNo, meta.tMs, payload);
            headerFill = 0;
            meta = null;
            payload = null;
            payloadFill = 0;
          }
        }
      }
    };
  }

  async function startLiveStream() {
    if (!liveRunning || !liveSessionId || !liveCanvas) return;
    abortLiveStream();
    const token = liveStreamToken;
    const controller = new AbortController();
    liveStreamAbort = controller;
    try {
      const response = await fetch("/api/live/stream", {
        cache: "no-store",
        signal: controller.signal
      });
      if (token !== liveStreamToken) return;
      if (!response.ok || !response.body) {
        scheduleLiveStreamRetry(token);
        return;
      }
      const reader = response.body.getReader();
      const feed = createLiveParser(handleLiveFrame);
      while (true) {
        const result = await reader.read();
        if (token !== liveStreamToken) return;
        if (result.done) break;
        feed(result.value);
      }
      if (token === liveStreamToken && liveRunning) {
        scheduleLiveStreamRetry(token);
      }
    } catch (error) {
      if (error && error.name === "AbortError") return;
      if (token === liveStreamToken && liveRunning) {
        scheduleLiveStreamRetry(token);
      }
    } finally {
      if (liveStreamAbort === controller) {
        liveStreamAbort = null;
        try { controller.abort(); } catch (error) { /* ignore */ }
      }
    }
  }

  function restorePlaybackView() {
    // The raw preview overlays the replay frame; tear it down even when this
    // page already has replay frames to show.
    resetLiveView();
    if (frames.length) {
      showFrame(frameIndex);
      return;
    }
    if (img) img.hidden = true;
    if (stage) stage.classList.add("is-empty");
    if (stageEmpty) {
      stageEmpty.hidden = false;
      if (stageEmptyText) stageEmptyText.textContent = "没有可回放的会话";
      if (stageEmptySub) stageEmptySub.textContent = "点击上方「测试」进入测试，或用「录制」采集帧";
    }
    setHud("FRAME", "----", 0, "t = 0 ms");
    if (frameTotal) frameTotal.textContent = "0";
  }

  function applyLiveState(starting, running, test) {
    const nextMode = starting || running;
    const state = starting ? "starting" : running ? "running" : "stopped";
    liveTestMode = Boolean(test) && nextMode;
    if (replayPanel) replayPanel.dataset.liveState = state;
    if (recordControls) {
      recordControls.dataset.liveState = state;
      recordControls.dataset.liveTest = liveTestMode ? "1" : "0";
    }
    if (modeNote) {
      modeNote.textContent = nextMode
        ? (liveTestMode ? "测试模式" : "录制模式")
        : "回放模式";
    }
    const changed = nextMode !== liveMode;
    liveMode = nextMode;
    if (changed) {
      if (liveMode) {
        snapshotMode = null;
        pendingRegions = [];
        renderPending();
        if (selection) selection.hidden = true;
        if (diffToggle) diffToggle.checked = false;
        if (diffLayer) { diffLayer.textContent = ""; diffLayer.hidden = true; }
      } else {
        restorePlaybackView();
      }
    }
    updateSaveState();
  }

  function updateLiveView(data, starting, test) {
    const total = Number(data.frame_count);
    liveFrameCount = Number.isFinite(total) && total >= 0 ? total : 0;
    if (liveHasFrame) {
      if (img) img.hidden = true;
      if (liveCanvas) liveCanvas.hidden = false;
      if (stage) stage.classList.remove("is-empty");
      if (stageEmpty) stageEmpty.hidden = true;
      const shownTotal = Math.max(liveFrameCount, liveFrameNo || 0);
      setHud(
        "LIVE",
        liveFrameNo === null ? "----" : padFrame(liveFrameNo),
        shownTotal,
        "t = " + (liveFrameTMs || data.t_ms || 0) + " ms"
      );
      if (frameTotal) frameTotal.textContent = String(shownTotal);
    } else {
      if (liveCanvas) liveCanvas.hidden = true;
      if (img) img.hidden = true;
      if (stage) stage.classList.add("is-empty");
      if (stageEmpty) {
        stageEmpty.hidden = false;
        if (stageEmptyText) {
          stageEmptyText.textContent = starting
            ? (test ? "正在启动测试…" : "正在启动录制…")
            : "等待第一帧…";
        }
        if (stageEmptySub) {
          stageEmptySub.textContent = starting ? "构建并启动运行时" : "运行时已启动，尚未产生画面";
        }
      }
      setHud(
        "LIVE",
        "----",
        liveFrameCount,
        "t = " + (data.t_ms || 0) + " ms"
      );
      if (frameTotal) frameTotal.textContent = String(liveFrameCount);
    }
    updateSaveState();
  }

  function updateLiveButtons(starting, running, test) {
    const liveRecord = $("live-record");
    const liveTest = $("live-test");
    const activeRecording = running && !test;
    const activeTesting = running && test;
    if (liveApp) liveApp.disabled = starting || liveSwitching;
    if (liveRecord) {
      liveRecord.disabled = starting || activeTesting;
      liveRecord.dataset.active = activeRecording ? "1" : "0";
      const label = liveRecord.querySelector(".btn-label");
      if (label) label.textContent = activeRecording ? "停止录制" : "录制";
    }
    if (liveTest) {
      liveTest.disabled = starting || activeRecording;
      liveTest.dataset.active = activeTesting ? "1" : "0";
      const label = liveTest.querySelector(".btn-label");
      if (label) label.textContent = activeTesting ? "停止测试" : "测试";
    }
  }

  function selectLiveApp(app) {
    if (!liveApp) return;
    if (!app) {
      liveApp.value = "";
      lastLiveApp = "";
      return;
    }
    for (let index = 0; index < liveApp.options.length; index += 1) {
      if (liveApp.options[index].value === app) {
        liveApp.value = app;
        lastLiveApp = app;
        return;
      }
    }
  }

  async function refreshLive() {
    const token = liveRequestToken;
    const result = await liveCall("GET", "/api/live");
    if (token !== liveRequestToken) return;
    if (!result.ok || !result.data) return;
    const data = result.data;
    liveSessionId = data.session_id || null;
    if (liveSessionId !== previousLiveSessionId) {
      previousLiveSessionId = liveSessionId;
      resetLiveView();
    }
    const starting = Boolean(data.starting);
    const running = Boolean(data.running);
    const test = Boolean(data.test);
    liveStarting = starting;
    liveRunning = running;
    if ((starting || running) && data.app) selectLiveApp(data.app);
    applyLiveState(starting, running, test);
    updateLiveButtons(starting, running, test);
    updateManagerAvailability(starting, running);
    if (liveStatus) {
      if (starting) liveStatus.textContent = "启动中…";
      else if (running) {
        liveStatus.textContent =
          (test ? "测试中" : "录制中") + " · " + data.frame_count + " 帧";
      }
      else if (data.session_id) liveStatus.textContent = "已停止";
      else liveStatus.textContent = "未启动";
    }
    if (liveSession) {
      liveSession.textContent = "";
      if (!test && data.session_id && (starting || running)) {
        const link = document.createElement("a");
        link.href = sessionUrl(data.session_id);
        link.textContent = "打开回放";
        liveSession.appendChild(link);
      }
    }
    if (liveMode) {
      updateLiveView(data, starting, test);
      if (running && liveSessionId) {
        if (!liveStreamAbort && !liveStreamRetry) startLiveStream();
      } else {
        resetLiveView();
      }
    }
  }

  async function bootLive() {
    await refreshLive();
    if (manageRequested) {
      openAppManager();
      return;
    }
    if (!liveApp || liveRunning || liveStarting) return;
    // Opening a saved replay (?session=...) must not replace it with live
    // preview. The bare page defaults to the first app.
    if (new URLSearchParams(window.location.search).has("session")) return;
    await previewSelectedApp();
  }

  function liveStartPath(mode) {
    const params = [];
    if (mode) params.push("mode=" + encodeURIComponent(mode));
    if (liveApp && liveApp.value) {
      params.push("app=" + encodeURIComponent(liveApp.value));
    }
    return "/api/live/start" + (params.length ? "?" + params.join("&") : "");
  }

  async function changeLive(method, path) {
    // Discard polls issued before this transition...
    liveRequestToken += 1;
    const liveRecord = $("live-record");
    const liveTest = $("live-test");
    if (liveRecord) liveRecord.disabled = true;
    if (liveTest) liveTest.disabled = true;
    if (path.indexOf("/api/live/start") === 0) {
      if (liveStatus) liveStatus.textContent = "启动中…";
      if (recordControls) recordControls.dataset.liveState = "starting";
    } else if (path === "/api/live/stop") {
      if (liveStatus) liveStatus.textContent = "正在停止…";
    }
    const result = await liveCall(method, path);
    // ...and polls that started while the transition was in flight.
    liveRequestToken += 1;
    if (!result.ok) {
      const message = result.data && result.data.error
        ? result.data.error.message
        : "HTTP " + result.status;
      if (liveStatus) liveStatus.textContent = "操作未完成：" + message;
      await refreshLive();
      return;
    }
    if (path === "/api/live/stop") {
      const stoppedId = result.data && result.data.session_id;
      // A test session is discarded on stop; only a recording becomes a
      // replay session worth opening.
      if (!liveTestMode && stoppedId) {
        window.location.href = sessionUrl(stoppedId);
        return;
      }
    }
    await refreshLive();
  }

  async function previewSelectedApp() {
    if (!liveApp || liveSwitching || liveStarting) return;
    const app = liveApp.value;
    if (liveRunning && !liveTestMode) {
      const proceed = window.confirm(
        "切换应用会停止当前录制并开始测试预览，继续吗？"
      );
      if (!proceed) {
        selectLiveApp(lastLiveApp);
        return;
      }
    }
    liveSwitching = true;
    liveApp.disabled = true;
    liveRequestToken += 1;
    try {
      if (liveRunning) {
        // Stop directly instead of changeLive(): a recording stop normally
        // redirects to the replay page, but an app switch must stay live.
        const stopped = await liveCall("POST", "/api/live/stop");
        if (!stopped.ok && stopped.status !== 409) {
          const message = stopped.data && stopped.data.error
            ? stopped.data.error.message
            : "HTTP " + stopped.status;
          if (liveStatus) liveStatus.textContent = "切换未完成：" + message;
          return;
        }
      }
      lastLiveApp = app;
      // Selecting an app means "show me this app now". Use test mode so the
      // switch never starts an unwanted recording.
      await changeLive("POST", liveStartPath("test"));
    } finally {
      liveSwitching = false;
      if (liveApp) liveApp.disabled = false;
      await refreshLive();
    }
  }

  const liveRecordButton = $("live-record");
  const liveTestButton = $("live-test");
  if (liveApp) liveApp.addEventListener("change", previewSelectedApp);
  if (liveRecordButton) liveRecordButton.addEventListener("click", function () {
    if (liveRecordButton.dataset.active === "1") {
      changeLive("POST", "/api/live/stop");
    } else {
      changeLive("POST", liveStartPath(null));
    }
  });
  if (liveTestButton) liveTestButton.addEventListener("click", function () {
    if (liveTestButton.dataset.active === "1") {
      changeLive("POST", "/api/live/stop");
    } else {
      changeLive("POST", liveStartPath("test"));
    }
  });
